<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AHHHHHH!!!!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Fondo claro u oscuro según Configuración > Apariencia (no sigue el modo del sistema) */
  :root{
    --bg:#D9D9D9;
    --surface:#FFFFFF;
    --surface-alt:#ECECEA;
    --border:#C9C7C2;
    --text:#2B2925;
    --text-muted:#6F6A62;
    --accent:#B34567;
    --accent-strong:#942F4D;
    --accent-soft:#F2DDE3;
    --on-accent:#FFF3F0;
    --alert-bg:#4a2f2a;
    --alert-text:#f0c9bd;
    --alert-body-text:#e3b6a8;
    --alert-border:#6b453d;
    --cat-tarea:#5fb8b0;      --cat-tarea-ink:#0e8077;
    --cat-cita:#a08bd8;       --cat-cita-ink:#6a4aa8;
    --cat-actividad:#8bb06a;  --cat-actividad-ink:#557b3d;
    --cat-libre:#6f95c4;      --cat-libre-ink:#3e6899;
    --warn-bg:#e8b839;
    --warn-text:#2b1d02;
    --warn-ink:#8a6a12;
    --danger-bg:#ef4b4b;
    --danger-text:#fff5f4;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 26px rgba(0,0,0,.10);
    --font-display:'Fraunces', serif;
    --font-body:'IBM Plex Sans', system-ui, sans-serif;
    /* Trazo de dibujo (post-its y barra de la niña) y tinta sobre post-its de color */
    --ink:#2B2925;
    --cat-tarea-deep:#0b3431; --cat-cita-deep:#271a47; --cat-actividad-deep:#1f3312; --cat-libre-deep:#14263d;
  }
  /* Fondo oscuro: paleta de Design.html */
  :root[data-theme="dark"]{
    --bg:#322e2b;
    --surface:#47413a;
    --surface-alt:#3c3732;
    --border:#5c554c;
    --text:#f5f0e8;
    --text-muted:#b3a99b;
    --accent:#d6738a;
    --accent-strong:#e896aa;
    --accent-soft:rgba(214,115,138,.18);
    --on-accent:#2b1a1f;
    --cat-tarea-ink:#5fb8b0;
    --cat-cita-ink:#a08bd8;
    --cat-actividad-ink:#8bb06a;
    --cat-libre-ink:#6f95c4;
    --warn-ink:#e8b839;
    --ink:#15120f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .page-pad{ width:100%; display:flex; justify-content:center; padding:32px 16px 48px; }

  .app-shell{
    width:100%;
    max-width:428px;
    background:var(--bg);
    border-radius:28px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:780px;
  }

  .topbar{
    padding:20px 20px 16px;
    border-bottom:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .topbar .brand{
    font-family:var(--font-body);
    font-weight:600;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .topbar h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:32px;
    margin:2px 0 0;
    text-wrap:balance;
  }
  .topbar .subtitle{
    font-size:13px;
    color:var(--text-muted);
    margin-top:2px;
  }

  main.screen-container{
    flex:1;
    overflow-y:auto;
    padding:18px 18px 100px;
  }
  .screen{ display:none; flex-direction:column; gap:20px; }

  /* En el móvil la App ocupa toda la pantalla (sin el marco de teléfono de la maqueta):
     cabecera y barra de pestañas fijas, y solo el contenido de cada pantalla se desplaza. */
  @media (max-width:500px){
    body{ margin:0; min-height:100dvh; }
    .page-pad{ padding:0; }
    .app-shell{ max-width:none; height:100dvh; min-height:0; border:none; border-radius:0; box-shadow:none; }
    main.screen-container{ min-height:0; padding-bottom:18px; }
  }
  .screen.active{ display:flex; }

  h2.section-title{
    font-family:var(--font-body);
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:0 0 10px;
  }

  /* ---- Today: estructura común ---- */
  /* Cabecera compacta: sin la marca, título más pequeño y la fecha al lado */
  .is-today .topbar{ padding:12px 20px 10px; flex-direction:row; flex-wrap:wrap; align-items:baseline; column-gap:10px; }
  .is-today .topbar .brand{ display:none; }
  .is-today .topbar h1{ font-size:26px; margin:0; }
  .is-today .topbar{ flex-wrap:nowrap; }
  .is-today .topbar .subtitle{ margin:0; flex:1; min-width:0; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #screen-today{ gap:14px; }
  .today-more{ margin:0; font-size:12.5px; color:var(--text-muted); text-align:center; }
  #screen-today.active{ min-height:100%; }
  /* Próximos días: abajo del todo, pegada a la barra de pestañas aunque el resto se desplace */
  :root{ --load-border:#f2b27a; --load-bg:#fff4c7; --load-title:#8a4b12; }
  .load-card{
    margin-top:auto; position:sticky; bottom:0; z-index:30;
    background:var(--load-bg); border:2px solid var(--load-border); border-radius:14px;
    padding:10px 14px; box-shadow:0 -6px 16px rgba(0,0,0,.08);
    /* los colores de categoría del modo claro, legibles sobre el amarillo pastel también en modo oscuro */
    --cat-tarea-ink:#0e8077; --cat-cita-ink:#6a4aa8; --cat-actividad-ink:#557b3d; --cat-libre-ink:#3e6899;
  }
  .load-card[hidden]{ display:none; }
  .load-toggle{ all:unset; box-sizing:border-box; width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer; color:var(--load-title); }
  .load-toggle:focus-visible{ outline:2px solid var(--load-border); outline-offset:3px; border-radius:6px; }
  .load-title{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--load-title); }
  .load-count{ display:none; }
  .load-chev{ flex:none; transition:transform .2s ease; }
  .load-list{ margin-top:4px !important; }
  /* Plegada (si no cabe todo sin taparse): solo el título con el número de tareas; se despliega al pulsar */
  .load-card.is-collapsed .load-list{ display:none; }
  .load-card.is-collapsed .load-count{ display:inline; }
  .load-card.is-collapsed .load-chev{ transform:rotate(180deg); }
  .load-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
  /* Cada tarea: nombre (se recorta si no cabe) y debajo tiempo · antes de fecha y hora */
  .load-list li{ display:flex; flex-direction:column; line-height:1.25; }
  .load-list .load-name{ font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .load-list .load-meta{ font-size:12px; font-weight:500; font-variant-numeric:tabular-nums; }
  .load-list .load-est{ font-weight:700; }
  .today-layout{ display:flex; flex-direction:column; gap:20px; }
  .section-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; }

  /* ---- Barra de tiempo «Puntos»: color de categoría + línea en la hora actual ---- */
  @keyframes needlePulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(43,41,37,.5); } 70%{ box-shadow:0 0 0 10px rgba(43,41,37,0); } }
  .day-strip{ position:relative; height:64px; }
  .day-strip .bar{
    position:absolute; left:0; right:0; top:32px; height:12px; border-radius:999px;
    background:linear-gradient(90deg, #f0c9a0 0%, #f5e0a8 32%, #e0a06a 62%, #4a3a5a 85%, #2a2438 100%);
  }
  .day-strip .marker{ position:absolute; border-radius:50%; transform:translateX(-50%); }
  .day-strip .marker.at-end{ transform:translateX(-100%); }
  .day-strip .stem{ position:absolute; width:1px; transform:translateX(-50%); }
  .day-strip .stem.at-end{ transform:translateX(-100%); }
  .day-strip .now-line{ position:absolute; top:0; width:3px; border-radius:2px; background:var(--text); transform:translateX(-50%); }
  .day-strip .now-dot{ position:absolute; border-radius:50%; background:var(--text); transform:translateX(-50%); animation:needlePulse 2s ease-out infinite; }
  .day-strip .now-label{ position:absolute; transform:translateX(-50%); font-size:10px; font-weight:700; color:var(--text); white-space:nowrap; }
  .day-strip .now-label.at-start{ transform:translateX(-6px); }
  .day-strip .now-label.at-end{ transform:translateX(calc(-100% + 6px)); }
  .day-strip-scale{ position:relative; display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted); margin-top:0; font-variant-numeric:tabular-nums; }
  .day-strip-scale .scale-school{ position:absolute; top:0; white-space:nowrap; }
  /* Tramo del cole: hueco rayado sobre la barra */
  .day-strip .school-gap{
    position:absolute; top:28px; height:20px; border-radius:6px;
    border:1px solid var(--border);
    background:repeating-linear-gradient(135deg, var(--surface-alt), var(--surface-alt) 4px, var(--border) 4px, var(--border) 5px);
  }
  .day-strip .school-icon{ position:absolute; bottom:16px; transform:translateX(-50%); height:auto; overflow:visible; }

  /* ---- Barra de tiempo «Niña soldado»: el camino del día ---- */
  .timeline svg{ display:block; width:100%; height:auto; overflow:visible; }
  .tl-label{ font-family:var(--font-body); font-size:10px; font-weight:700; fill:var(--text); font-variant-numeric:tabular-nums; }
  .tl-label.is-muted{ fill:var(--text-muted); font-weight:500; }
  .tl-label.is-now{ fill:var(--accent-strong); }
  .boom{ transform-box:fill-box; transform-origin:center; animation:boomIdle var(--dur,2.6s) ease-in-out infinite; animation-delay:var(--delay,0s); }
  .boom.is-next{ animation:boomBig 2.4s cubic-bezier(.3,1.6,.5,1) infinite; }
  @keyframes boomIdle{ 0%,100%{ transform:scale(1) rotate(0deg); } 50%{ transform:scale(1.08) rotate(5deg); } }
  @keyframes boomBig{
    0%{ transform:scale(.8) rotate(0deg); }
    14%{ transform:scale(1.24) rotate(-8deg); }
    30%{ transform:scale(1) rotate(2deg); }
    100%{ transform:scale(.8) rotate(0deg); }
  }
  .spark{ opacity:0; animation:spark 2.4s ease-out infinite; }
  @keyframes spark{
    0%,10%{ opacity:0; transform:translate(0,0); }
    16%{ opacity:1; }
    55%{ opacity:0; transform:translate(var(--sx),var(--sy)); }
    100%{ opacity:0; transform:translate(var(--sx),var(--sy)); }
  }
  .w-bob{ animation:bob .45s ease-in-out infinite alternate; }
  .ponytail{ transform-box:fill-box; transform-origin:100% 50%; animation:swing-hair .45s ease-in-out infinite alternate; }
  @keyframes bob{ from{ transform:translateY(0); } to{ transform:translateY(-1.4px); } }
  @keyframes swing-hair{ from{ transform:rotate(-14deg); } to{ transform:rotate(16deg); } }

  /* ---- Tema «Lista» ---- */
  .up-next-card{ border-radius:18px; padding:11px 16px; background:var(--warn-bg); color:var(--warn-text); }
  .up-next-time{ font-family:var(--font-display); font-weight:700; font-size:28px; }
  .up-next-title{ font-family:var(--font-display); font-weight:600; font-size:18px; }
  .up-next-sub{ font-size:12.5px; font-weight:600; margin-top:6px; }
  .later-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .later-chip{
    border-radius:14px; padding:10px 14px; flex:1; min-width:152px;
    background:color-mix(in srgb, var(--c) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--c) 40%, transparent);
  }
  .later-time{ font-size:11px; font-weight:700; color:var(--c-ink); }
  .later-title{ font-size:12.5px; font-weight:600; margin-top:3px; }
  .later-sub{ font-size:10.5px; color:var(--text-muted); margin-top:2px; }

  /* ---- Tema «Post-it 1» (Design.html · Siguiente ahora): protagonista + baraja ---- */
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.015); } }
  @keyframes glowPulse{ 0%,100%{ box-shadow:0 0 0 rgba(232,184,57,0), 0 16px 34px rgba(0,0,0,.22); } 50%{ box-shadow:0 0 46px rgba(232,184,57,.5), 0 16px 34px rgba(0,0,0,.22); } }
  @keyframes bob1{ 0%,100%{ transform:translateY(0) rotate(-7deg); } 50%{ transform:translateY(-7px) rotate(-7deg); } }
  @keyframes bob2{ 0%,100%{ transform:translateY(0) rotate(5deg); } 50%{ transform:translateY(-10px) rotate(5deg); } }
  @keyframes bob3{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-6px) rotate(-3deg); } }
  .hero-eyebrow{ text-align:center; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
  .hero-card{
    background:var(--warn-bg); color:var(--warn-text); border-radius:26px; padding:14px 18px; text-align:center;
    animation:glowPulse 3.2s ease-in-out infinite, breathe 3.2s ease-in-out infinite;
  }
  .hero-head{ display:flex; align-items:baseline; justify-content:center; gap:12px; flex-wrap:wrap; }
  .hero-time{ font-family:var(--font-display); font-weight:700; font-size:32px; line-height:1; }
  .hero-title{ font-family:var(--font-display); font-weight:600; font-size:21px; }
  .hero-place{ font-size:13px; font-weight:600; margin-top:6px; opacity:.85; }
  .hero-leave{ display:flex; justify-content:center; gap:8px; margin-top:8px; }
  /* Hora de salida: solo icono (andando / coche) y hora */
  .leave-chip{ display:inline-flex; align-items:center; gap:5px; background:rgba(0,0,0,.12); font-weight:700; font-size:12.5px; padding:4px 10px; border-radius:999px; font-variant-numeric:tabular-nums; }
  .fan{ display:flex; align-items:center; justify-content:center; padding:8px 0 10px; }
  .fan-card{
    position:relative; flex:none; width:112px; min-height:134px; margin-right:-16px;
    /* mismo código de color que los post-its de Post-it 2 */
    background:linear-gradient(160deg, rgba(255,255,255,.32), rgba(255,255,255,0) 48%), var(--c);
    border:1.5px solid rgba(43,41,37,.8); border-radius:16px; padding:13px; color:var(--deep);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), var(--shadow);
  }
  .fan-card:last-child{ margin-right:0; }
  .fan-card:nth-child(3n+1){ animation:bob1 3.6s ease-in-out infinite; }
  .fan-card:nth-child(3n+2){ animation:bob2 4.1s ease-in-out infinite; }
  .fan-card:nth-child(3n+3){ animation:bob3 3.8s ease-in-out infinite; }
  .fan-time{ font-size:11px; font-weight:700; color:var(--deep); }
  .fan-title{ font-size:13px; font-weight:700; margin-top:5px; line-height:1.2; hyphens:auto; overflow-wrap:break-word; }
  .fan-sub{ font-size:10.5px; color:var(--text-muted); margin-top:4px; }

  /* ---- Primer elemento: color según lo que falta ----
     más de 1 h: borde y texto del color de la categoría, relleno poco más oscuro que el fondo
     entre 1 h y 30 min: borde y texto ámbar (todo en negrita), relleno del color de la categoría
     30 min o menos: borde y texto rojo oscuro (todo en negrita), relleno del color de la categoría */
  :root{ --calm-fill:color-mix(in srgb, var(--bg) 88%, #000); --amber-line:#e0a100; --amber-text:#7a5000; --red-line:#a31515; --red-text:#8b1111; }
  :root[data-theme="dark"]{ --calm-fill:color-mix(in srgb, var(--bg) 72%, #000); }
  /* (también el punto del próximo en la barra de tiempo) */
  .st-calm{ --st-line:var(--c-ink); --st-text:var(--c-ink); --st-fill:var(--calm-fill); }
  .st-soon{ --st-line:var(--amber-line); --st-text:var(--amber-text); --st-fill:var(--c); }
  .st-urgent{ --st-line:var(--red-line); --st-text:var(--red-text); --st-fill:var(--c); }
  .day-strip .marker.next-dot{ background:var(--st-fill); border:3px solid var(--st-line); animation:statePulse 2.2s ease-out infinite; }
  .day-strip .stem.next-stem{ background:var(--st-line); }
  @keyframes statePulse{ 0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--st-line) 60%, transparent); } 70%{ box-shadow:0 0 0 10px color-mix(in srgb, var(--st-line) 0%, transparent); } }
  .up-next-card.next-card, .hero-card.next-card, .pi-next.next-card{ background:var(--st-fill); color:var(--st-text); border:3px solid var(--st-line); }
  .pi-next.next-card{ box-shadow:0 3px 0 var(--st-line); }
  .hero-card.next-card{ animation:breathe 3.2s ease-in-out infinite; }
  .next-card.st-soon, .next-card.st-soon *, .next-card.st-urgent, .next-card.st-urgent *{ font-weight:700; }

  /* ---- Tema «Post-it 2» (boceto-today.html): barra del próximo + post-its flotantes ---- */
  .pi-next{
    position:relative; overflow:hidden; flex:none;
    display:flex; align-items:center; gap:12px;
    background:var(--warn-bg); color:var(--warn-text);
    border:2px solid var(--ink); border-radius:16px;
    box-shadow:0 3px 0 var(--ink);
    padding:11px 16px;
  }
  .pi-next::after{
    content:""; position:absolute; top:0; bottom:0; left:-60%; width:40%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    animation:sheen 6s ease-in-out infinite; pointer-events:none;
  }
  @keyframes sheen{ 0%,70%{ left:-60%; } 100%{ left:130%; } }
  .pi-next-time{ font-family:var(--font-display); font-weight:700; font-size:24px; line-height:1; font-variant-numeric:tabular-nums; }
  .pi-next-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .pi-next-title{ font-family:var(--font-display); font-weight:600; font-size:18px; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pi-next-place{ font-size:11.5px; font-weight:600; opacity:.85; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pi-next-side{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; text-align:right; }
  .pi-next-when{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .pi-next-leave{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; }   /* andando y coche, uno encima del otro */
  .pi-next .leave-chip{ padding:2px 7px; font-size:12px; background:rgba(0,0,0,.1); }
  /* Las tarjetas de «Hoy» se abren en su pantalla */
  #screen-today [data-open]{ cursor:pointer; }
  #screen-today [data-open]:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }

  .board{ position:relative; flex:none; height:392px; }
  .note{
    position:absolute; width:min(52%, 180px); min-height:165px;
    left:var(--x); top:var(--y); z-index:var(--z);
    transform:rotate(var(--rot));
    transition:left .8s cubic-bezier(.34,1.25,.5,1), top .8s cubic-bezier(.34,1.25,.5,1), transform .8s cubic-bezier(.34,1.25,.5,1);
    animation:noteIn .9s cubic-bezier(.2,.9,.3,1.15) backwards;
    animation-delay:var(--in-delay, 0s);
    cursor:pointer; outline:none;
  }
  @keyframes noteIn{
    from{ opacity:0; transform:translateY(-40px) rotate(calc(var(--rot) - 14deg)) scale(.9); }
    to{ opacity:1; transform:translateY(0) rotate(var(--rot)) scale(1); }
  }
  .note-shadow{
    position:absolute; left:14%; right:14%; bottom:-22px; height:18px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(20,18,15,.34), rgba(20,18,15,0));
    animation:shadowFloat var(--dur) ease-in-out infinite; animation-delay:var(--delay);
  }
  .note-card{
    position:relative; min-height:165px;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:13px 15px; border-radius:22px;
    border:1.5px solid rgba(43,41,37,.8);
    background:linear-gradient(160deg, rgba(255,255,255,.32), rgba(255,255,255,0) 48%), var(--c);
    color:var(--deep);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 10px 20px rgba(0,0,0,.10);
    animation:float var(--dur) ease-in-out infinite; animation-delay:var(--delay);
  }
  /* Móviles pequeños: los elementos 2 a 4 más pequeños en las tres vistas */
  @media (max-width:360px), (max-height:620px){
    .later-row{ gap:6px; }
    .later-chip{ padding:6px 10px; min-width:120px; border-radius:12px; }
    .later-title{ font-size:12px; margin-top:1px; }
    .fan{ padding:4px 0 6px; }
    .fan-card{ width:94px; min-height:88px; padding:9px 10px; margin-right:-14px; }
    .fan-title{ font-size:12px; margin-top:3px; }
    .note{ width:min(50%, 170px); min-height:112px; }
    .note-card{ min-height:112px; padding:10px 12px; border-radius:18px; }
    .note .n-head{ top:9px; right:12px; }
    .note .n-time{ font-size:20px; }
    .note .n-title{ min-height:50px; font-size:14px; }
  }

  }
  .priority-select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .priority-select option{ color:var(--text); background:var(--surface); font-weight:500; }
  .row-delete{
    flex:none; width:24px; height:24px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface);
    color:var(--text-muted); font-size:15px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .row-edit{
    flex:none; width:24px; height:24px; border-radius:50%;

    display:flex; align-items:center; justify-content:center;

  .row-edit:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .row-delete:hover{ background:var(--alert-bg); border-color:var(--alert-border); color:var(--alert-text); }
  .row-delete:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  /* ---- Calendar ---- */
  .seg-control{ display:flex; background:var(--surface-alt); border:1px solid var(--border); border-radius:10px; padding:3px; gap:3px; }
  .seg-btn{
    flex:1; border:none; background:none; cursor:pointer;

  .seg-btn.is-active{ background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow); }
  .seg-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  /* La página cabe sin scroll: controles en una fila, horario escolar comprimido */
  .screen-container:has(#screen-calendar.active){ padding-bottom:18px; }
  #screen-calendar{ gap:12px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cal-head .seg-control{ flex:none; }
  .cal-head .seg-btn{ flex:none; padding:5px 12px; }
  .cal-nav{ display:flex; align-items:center; gap:8px; min-width:0; }

  .cal-legend{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--text-muted); }

  .cal-legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }

  .cal-grid{ display:grid; }
  .cal-daylabel{
    text-align:center; font-size:11px; font-weight:600; color:var(--text-muted);

  .cal-daylabel .dl-date{ font-size:12px; font-variant-numeric:tabular-nums; }

  .cal-hourcol{ position:relative; }
  .cal-hourlabel{
    position:absolute; right:6px; transform:translateY(-50%);
    font-size:9.5px; color:var(--text-muted); font-variant-numeric:tabular-nums;
  }
  .cal-hourlabel:first-child{ transform:none; }
  .cal-hourlabel.is-last{ transform:translateY(-100%); }
  .cal-school-icon{ position:absolute; left:50%; width:30px; height:auto; transform:translate(-50%, -50%); overflow:visible; }

  .cal-daycol{ position:relative; border-left:1px solid var(--border); }
  .cal-daycol.is-today{ background-color:var(--accent-soft); }
  .cal-hourline{ position:absolute; left:0; right:0; height:1px; background:var(--border); }

  /* Horario escolar: tramo comprimido y rayado (igual que en la barra de Today) */
  .school-band{
    position:absolute; left:0; right:0; opacity:.8;
    border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    background:repeating-linear-gradient(135deg, transparent, transparent 4px, var(--border) 4px, var(--border) 5px);

  }
  .school-band span{ background:var(--surface-alt); padding:0 5px; border-radius:4px; }

  .cal-bar{
    position:absolute; left:2px; right:2px; border-radius:5px; padding:2px 4px; min-height:14px;
    overflow:hidden; display:flex; flex-direction:column; justify-content:flex-start;
    font-size:10.5px; color:#2B2925; line-height:1.15;
  }
  .cal-bar .bar-title{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-bar .bar-time{ font-size:9.5px; opacity:.85; font-variant-numeric:tabular-nums; }
  .cal-bar.cat-actividad{ background:var(--cat-actividad); }
  .cal-bar.cat-libre{ background:var(--cat-libre); }
  .cal-bar.is-open{ cursor:pointer; }
  .cal-bar.is-open:focus-visible{ outline:2px solid var(--text); outline-offset:1px; z-index:3; }
  .cal-bar.cat-cita, .cal-bar.cat-evento{ background:var(--cat-cita); }
  /* Entrega de tarea: bloque estándar de 30 min que termina en la deadline (solo visual) */
  .cal-bar.cat-tarea{ background:var(--cat-tarea); border-bottom:2px solid var(--cat-tarea-ink); }

  /* ---- Tab bar ---- */
  .tabbar{
    position:sticky; bottom:0;
    display:grid; grid-template-columns:repeat(6,1fr);
    border-top:1px solid var(--border);
    background:var(--surface);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; cursor:pointer;
    color:var(--text-muted);
    font-family:var(--font-body); font-size:10px; font-weight:600;
    padding:6px 1px; border-radius:10px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .tab svg{ flex:none; }
  @media (max-width:380px){ .tab{ font-size:9px; letter-spacing:-.01em; } }
  /* Móviles estrechos: cada pestaña ocupa lo que necesita su texto */
  @media (max-width:340px){ .tabbar{ display:flex; justify-content:space-between; padding-left:2px; padding-right:2px; } .tab{ flex:0 1 auto; font-size:8.4px; letter-spacing:-.03em; padding:6px 1px; } }
  .tab.is-active{ color:var(--accent); }
  .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px);
    background:var(--text); color:var(--bg);
    padding:10px 16px; border-radius:10px; font-size:13px; font-weight:500;
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
    max-width:90vw; text-align:center; z-index:20;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion: reduce){
    .toast{ transition:none; }
  }
</style>

  };
  var LANG = 'es';

  function t(key, vars){
    var s = I18N[LANG][key];
    if(s == null){ s = I18N.es[key]; }
    if(s == null){ return key; }
    vars = vars || {};
    if(vars.name == null){ vars.name = KID; }
    return s.replace(/\{(\w+)\}/g, function(m, k){ return vars[k] != null ? vars[k] : m; });
  }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function fmtDate(d, opts){ return new Intl.DateTimeFormat(LOCALES[LANG], opts).format(d); }
  function isoDate(iso){ var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function ddmm(d){ return (d.getDate() < 10 ? '0' : '') + d.getDate() + '/' + (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1); }
  // Nombre del día de la semana (lunes = 0); el 7/9/2026 es lunes
  function weekdayName(i, style){ return fmtDate(new Date(2026, 8, 7 + i), { weekday: style || 'long' }); }
  var TODAY_DATE = new Date(2026, 8, 11);
  function todaySubtitle(){
    return cap(fmtDate(TODAY_DATE, { weekday:'long', day:'numeric', month:'long' })) + ' · ' + t('planOf');
  }

  function loadLanguage(){
    try{ var l = localStorage.getItem('app-language'); if(l && I18N[l]){ LANG = l; } }catch(e){}
  }
  function setLanguage(l){
    if(!I18N[l]){ return; }
    LANG = l;
    try{ localStorage.setItem('app-language', l); }catch(e){}
    applyI18n();
  }

  // Aplica el idioma a todo lo que está en el HTML y vuelve a dibujar lo generado
  function applyI18n(){
    document.documentElement.lang = LANG;
    var sel = document.getElementById('lang-select');
    if(sel){ sel.value = LANG; }
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    document.querySelectorAll('[data-i18n-title]').forEach(function(el){ el.setAttribute('title', t(el.dataset.i18nTitle)); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.setAttribute('placeholder', t(el.dataset.i18nPh)); });
    document.querySelectorAll('.priority-select option').forEach(function(o){ o.textContent = t('prio.' + o.value); });
    // Días de la semana y fechas de los datos de ejemplo
    document.querySelectorAll('[data-days]').forEach(function(el){
      el.textContent = cap(el.dataset.days.split(',').map(function(d){ return weekdayName(+d); }).join(t('and')));
    });
    document.querySelectorAll('[data-date]').forEach(function(el){
      var d = isoDate(el.dataset.date);
      el.textContent = cap(fmtDate(d, { weekday:'short' }).replace('.', '')) + ' ' + ddmm(d);
    });
    renderLoad();
    var active = document.querySelector('.tab.is-active');
    if(active){ setScreenHeading(active); }
    document.getElementById('cal-range').textContent = calRangeText(calView);
    renderExportCats();
    renderEvents();
    refreshEventForm();
    renderActivities();
    refreshActivityForm();
    renderTasks();
    refreshOpenDetails();
    onScheduleChanged();
    applyAppearance();
  }

  function showScreen(btn){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('is-active'));
    btn.classList.add('is-active');
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-'+btn.dataset.screen).classList.add('active');
    setScreenHeading(btn);
    DETAIL_BACK = null;   // al cambiar de pestaña, las fichas vuelven a su lista
    // «Hoy» lleva la cabecera compacta (sin la marca y con la fecha en la misma línea)
    document.querySelector('.app-shell').classList.toggle('is-today', btn.dataset.screen === 'today');
    if(btn.dataset.screen === 'calendar'){ fitCalendar(); }
    if(btn.dataset.screen === 'today'){ fitLoad(); }
  }

  function setScreenHeading(btn){
    var today = btn.dataset.screen === 'today';
    document.getElementById('screen-heading').textContent = today ? t('tab.today') : t(btn.dataset.title);
    document.getElementById('screen-subheading').textContent = today ? todaySubtitle() : t(btn.dataset.sub);
  }


  /* ================= TODAY ================= */
  /* Datos de ejemplo: viernes 11/09 a las 17:15 */
  var TODAY_DAY = 4;          // lunes = 0
  var NOW = 17.25;
  // Nombre de una categoría tal como está en Configuración (o el de fábrica traducido)
  function catName(cat){
    var row = document.querySelector('#category-list .cat-row[data-cat="' + cat + '"]');
    return row ? rowName(row) : t('cat.' + cat);
  }
  function rowName(row){
    var input = row.querySelector('.cat-name-input');
    return input ? (input.value || t('category')) : t('cat.' + row.dataset.cat);
  }
  // kind: pantalla en la que se abre al pulsarlo (activity / event / task); end: fin si tiene duración.
  // leaves: hora de salida por modo; andando solo si el destino está a menos de 1 km.
  var TODAY_NEXT = { id:'natacion', kind:'activity', t:18, end:19, cat:'actividad', title:'Natación',

  // Escala de la barra: toda la franja horaria de hoy. En días de cole, el horario
  // escolar se dibuja como un tramo comprimido (SCHOOL_SHARE del ancho) y el resto
  // del ancho se reparte en proporción al tiempo fuera del cole.
  var SCHOOL_SHARE = 0.12;
  function todayScale(){
    var b = dayBounds(), sc = schoolFor(TODAY_DAY);
    var start = toHours(b.start), end = toHours(b.end), school = null;
    var segs = [{ from:start, to:end }];
    if(sc.on){
      var a = Math.max(toHours(sc.entry), start), z = Math.min(toHours(sc.exit), end);
      if(a < z){
        school = { from:a, to:z };
        segs = [{ from:start, to:a }, { from:a, to:z, school:true }, { from:z, to:end }]
          .filter(function(g){ return g.to > g.from; });
      }
    }
    var outside = segs.reduce(function(sum, g){ return sum + (g.school ? 0 : g.to - g.from); }, 0);
    var x = 0;
    segs.forEach(function(g){
      g.w = g.school ? (outside ? SCHOOL_SHARE : 1) : (1 - (school ? SCHOOL_SHARE : 0)) * (g.to - g.from) / outside;
      g.x = x; x += g.w;
    });
    function pos(t){
      if(t <= start){ return 0; }
      if(t >= end){ return 1; }
      for(var i = 0; i < segs.length; i++){
        var g = segs[i];
        if(t <= g.to){ return g.x + g.w * (t - g.from) / (g.to - g.from); }
      }
      return 1;
    }
    if(school){ school.x0 = pos(school.from); school.x1 = pos(school.to); }
    return { start:start, end:end, school:school, pos:pos };
  }

  /* ---- Barra «Niña soldado» (de boceto-today.html) ---- */
  var TL_X0 = 20, TL_X1 = 304, TL_Y = 58;

  function seeded(seed){
    var v = seed;
    return function(){ v = (v * 9301 + 49297) % 233280; return v / 233280; };
  }

  function boomPoints(seed, rOut, rIn, spikes){
    var rnd = seeded(seed), pts = [];
    for(var k = 0; k < spikes * 2; k++){
      var a = (k + (rnd() - .5) * .5) * Math.PI / spikes - Math.PI / 2;
      var rad = k % 2 ? rIn * (.85 + rnd() * .3) : rOut * (.72 + rnd() * .5);
      pts.push((Math.cos(a) * rad).toFixed(2) + ',' + (Math.sin(a) * rad).toFixed(2));
    }
    return pts.join(' ');
  }

  function explosion(e, i, x){
    var big = !!e.next, color = catColor(e.cat), sparks = '';
    // El próximo lleva el contorno del código de color (categoría / ámbar / rojo oscuro)
    var line = big ? { 'st-calm':'var(--cat-' + e.cat + '-ink)', 'st-soon':'var(--amber-line)', 'st-urgent':'var(--red-line)' }[nextState(e.t)] : 'var(--ink)';
    if(big){
      for(var k = 0; k < 6; k++){
        var a = k / 6 * Math.PI * 2 + .3;
        sparks += '<g class="spark" style="--sx:' + (Math.cos(a) * 17).toFixed(1) + 'px;--sy:' + (Math.sin(a) * 17).toFixed(1) + 'px">' +
          '<circle r="' + (k % 2 ? 1.1 : 1.6) + '" fill="' + (k % 2 ? '#ffe066' : color) + '" stroke="var(--ink)" stroke-width=".6"/></g>';
      }
    }
    return '<g transform="translate(' + x.toFixed(1) + ' ' + TL_Y + ')">' + sparks +
      '<g class="boom' + (big ? ' is-next' : '') + '" style="--dur:' + (2.6 + i * .45) + 's;--delay:' + (-i * .7) + 's">' +
        '<polygon points="' + boomPoints(7 + i * 13, big ? 18 : 14.5, 7.5, 11) + '" fill="' + color + '" stroke="' + line + '" stroke-width="' + (big ? 2.6 : 1.3) + '" stroke-linejoin="round"/>' +
        '<polygon points="' + boomPoints(3 + i * 29, big ? 9.5 : 7.5, 4.4, 9) + '" fill="' + (big ? '#ffe066' : '#fff4c2') + '" stroke="var(--ink)" stroke-width=".9" stroke-linejoin="round"/>' +

  }

      '<line x1="0" y1="0" x2="0" y2="' + len + '" stroke="' + color + '" stroke-width="' + w + '" stroke-linecap="round"/>' +
      tip + '</g></g>';
  }

    var track = 'M20 52 H316 V44 L338 58 L316 72 V64 H20 A6 6 0 0 1 20 52 Z';
    var nowLabel = '';   // sin etiqueta con la hora actual: la niña marca el momento

      '<svg viewBox="0 -2 350 96" role="img" aria-label="Ahora ' + fmtHour(NOW) + '; próximos: ' + events.map(function(e){ return fmtHour(e.t); }).join(', ') + '">' +
      '<defs>' +

      '<path d="' + track + '" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>';
    // El cole se dibuja sobre el camino: la niña entra al empezar y sale al terminar
    if(r.school){

        '<text class="tl-label is-muted" x="' + Math.max(tx0 + tw / 2 - 30, 56).toFixed(1) + '" y="88" text-anchor="start">' + fmtHour(r.school.from) + '–' + fmtHour(r.school.to) + '</text>';
    }
    // Horas alternas abajo y arriba del camino, empezando abajo por la más próxima

    });

  var NOTE_SLOTS = [ { x:'0%', y:12, rot:-7 }, { x:'26%', y:98, rot:-2 }, { x:'47%', y:184, rot:5 } ];
  var NOTE_FLOAT = [
    { dur:'5.6s', delay:'-0.8s', sway:'1.4deg' },

      function front(){
        var k = noteOrder.indexOf(item.id);
        if(k > 0){ noteOrder.splice(k, 1); noteOrder.unshift(item.id); placeNotes(els); }
        else { openFromToday(item.id); }
      }
      note.addEventListener('click', front);
      note.addEventListener('keydown', function(e){
        if(e.target === note && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); front(); }
      });

  // Móviles pequeños: post-its más pequeños y más juntos
  var SMALL_PHONE = window.matchMedia('(max-width:360px), (max-height:620px)');

  function placeNotes(els){
    noteOrder.forEach(function(id, slot){
      var sl = NOTE_SLOTS[slot] || NOTE_SLOTS[NOTE_SLOTS.length - 1], el = els[id];
      el.style.setProperty('--x', sl.x);
      el.style.setProperty('--y', noteY(sl) + 'px');
      el.style.setProperty('--rot', sl.rot + 'deg');
      el.style.setProperty('--z', String(10 - slot));
    });
    // El tablero crece si algún post-it tiene más texto (pantallas estrechas)
    var board = els[noteOrder[0]].parentNode, h = 0;
    noteOrder.forEach(function(id, slot){
      var sl = NOTE_SLOTS[slot] || NOTE_SLOTS[NOTE_SLOTS.length - 1];
      h = Math.max(h, noteY(sl) + els[id].offsetHeight);

  /* ---- Categorías y prioridades (editable) ---- */
  var CAT_PALETTE = ['#4fc3f7','#b39ddb','#4cd6a0','#b7bfcb','#8c9eff','#4dd0e1'];

  function cycleColor(btn){
    var current = getComputedStyle(btn).backgroundColor;
    var idx = 0;
    for(var i=0;i<CAT_PALETTE.length;i++){
      if(hexToRgb(CAT_PALETTE[i]) === current){ idx = i; break; }
    }
    var next = CAT_PALETTE[(idx+1) % CAT_PALETTE.length];
    if(!btn.closest('.cat-row').classList.contains('is-editing')){ return; }
    btn.style.background = next;
    var select = btn.closest('.cat-row').querySelector('.priority-select');
    if(select){ select.style.background = next; }
    renderExportCats();
  }

  function hexToRgb(hex){
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgb(' + r + ', ' + g + ', ' + b + ')';
  }

  // Borrar categoría: si tiene eventos o actividades activos asociados, aviso con doble
  // confirmación; al confirmar se cancela todo lo asociado (con las tareas de los eventos).
  var catToDelete = null;
  function removeCategory(btn){
    var row = btn.closest('.cat-row');
    var linked = linkedToCategory(row.dataset.cat);
    if(!linked.length){ deleteCategoryRow(row, []); return; }
    catToDelete = { row: row, linked: linked, step: 1 };
    var name = rowName(row);
    el('cat-del-title').textContent = t('del.title', { name: name });
    el('cat-del-body').textContent = t(linked.length === 1 ? 'del.body1' : 'del.body', { n: linked.length });

    el('cat-del-warn').textContent = t('del.warn');

    go.classList.remove('is-confirm');

    el('cat-del-dialog').showModal();

  function confirmCatDelete(){
    var d = catToDelete, go = el('cat-del-go');

    if(d.step === 1){

      d.step = 2;
      el('cat-del-warn').textContent = t('del.step2', { name: rowName(d.row), n: d.linked.length });
      go.classList.add('is-confirm');
      go.textContent = t('del.confirm', { n: d.linked.length });
      return;
    }
    deleteCategoryRow(d.row, d.linked);
    closeCatDelete();
  }
  function closeCatDelete(){ catToDelete = null; el('cat-del-dialog').close(); }

  // Eventos activos (aún no terminados) y actividades de una categoría
  function linkedToCategory(id){
    var now = new Date(TODAY_DATE.getTime()); now.setHours(Math.floor(NOW), Math.round((NOW % 1) * 60));
    return USER_EVENTS.filter(function(e){
      if(e.cat !== id){ return false; }
      var end = isoDate(e.date); end.setMinutes(Math.round(toHours(e.time) * 60) + (e.dur || 60));
      return end > now;
    }).map(function(e){
      return { kind:'event', id:e.id, name:e.name, when: fmtDay(e.date) + ' ' + e.time + (e.task ? ' · ' + t('del.withTask') : '') };
    }).concat(USER_ACTS.filter(function(a){ return a.cat === id; }).map(function(a){
      // Las actividades recurrentes siempre están activas
      return { kind:'activity', id:a.id, name:a.name, when: sessionsText(a) + (a.task ? ' · ' + t('del.withTask') : '') };
    }));
  }

  function deleteCategoryRow(row, linked){
    var name = rowName(row), id = row.dataset.cat;
    var ids = linked.map(function(it){ return it.id; });
    USER_EVENTS = USER_EVENTS.filter(function(e){ return ids.indexOf(e.id) < 0; });
    USER_ACTS = USER_ACTS.filter(function(a){ return ids.indexOf(a.id) < 0; });
    storeActivities();
    renderActivities();
    renderTasks();
    // Los eventos pasados conservan su copia de la categoría; no se vuelve a crear al recargar
    DELETED_CATS.push(id);
    storeEvents();
    row.remove();
    renderExportCats();
    toast(linked.length ? t(linked.length === 1 ? 'toast.catDeletedAll1' : 'toast.catDeletedAll', { name: name, n: linked.length }) : t('toast.catDeleted', { name: name }));
  }

  // Lápiz: activa la edición del nombre y del color; el mismo botón (✓) o Intro la terminan
  var PENCIL_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
  var CHECK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  function editCategory(el){
    var row = el.closest('.cat-row'), input = row.querySelector('.cat-name-input'), btn = row.querySelector('.row-edit');
    var editing = !row.classList.contains('is-editing');

  /* ---- Franja horaria y horario escolar ---- */
  var SCHOOL = {
    week: {entry:'09:00', exit:'17:00'},            // lunes a viernes
    sat:  {on:false, entry:'09:00', exit:'13:00'}   // clases el sábado (opcional)
  };
  var DEFAULT_BOUNDS = {'day-start':'07:30', 'day-end':'23:00'};
  var TIME_RE = /^\d{2}:\d{2}$/;

  function toHours(t){ var p = t.split(':'); return +p[0] + (+p[1]) / 60; }
  function dayBounds(){
    return { start: document.getElementById('day-start').value || DEFAULT_BOUNDS['day-start'],
             end:   document.getElementById('day-end').value   || DEFAULT_BOUNDS['day-end'] };
  }

  // Horario del cole para un día de la semana (lunes = 0). Domingos y
  // festivos/no lectivos del calendario escolar: sin cole.
  function schoolFor(day){
    if(day < 5){ return {on:true, entry:SCHOOL.week.entry, exit:SCHOOL.week.exit}; }
    if(day === 5){ return SCHOOL.sat; }
    return {on:false};
  }

  // Franja horaria menos el horario escolar
  function coveredRanges(d){
    var b = dayBounds();
    if(!d.on){ return [[b.start, b.end]]; }
    var r = [];
    if(b.start < d.entry){ r.push([b.start, d.entry < b.end ? d.entry : b.end]); }
    if(d.exit < b.end){ r.push([d.exit > b.start ? d.exit : b.start, b.end]); }
    return r;
  }

  function rangesText(d){
    var r = coveredRanges(d);
    return r.length ? r.map(function(x){ return '<span style="white-space:nowrap">' + x[0] + '–' + x[1] + '</span>'; }).join(t('and')) : t('cover.none');
  }

  function renderCover(){
    var rows = [[t('monFri'), schoolFor(0)]];
    if(SCHOOL.sat.on){ rows.push([t('saturday'), SCHOOL.sat]); }
    rows.push([SCHOOL.sat.on ? t('cover.sunHol') : t('cover.weekendHol'), {on:false}]);
    var list = document.getElementById('cover-list');
    list.innerHTML = '';
    rows.forEach(function(r){
      var line = document.createElement('div');
      line.className = 'config-line';
      line.innerHTML = '<span class="config-label">' + r[0] + '</span><span class="config-value">' + rangesText(r[1]) + '</span>';
      list.appendChild(line);
    });
  }

  function onSchoolTime(which, field, input){
    var d = SCHOOL[which], v = input.value;
    var entry = field === 'entry' ? v : d.entry, exit = field === 'exit' ? v : d.exit;
    if(!TIME_RE.test(v) || entry >= exit){
      input.value = d[field];
      toast(t('toast.exitAfter'));
      return;
    }
    d[field] = v;
    onScheduleChanged();
  }

  function toggleSaturday(btn){
    SCHOOL.sat.on = !SCHOOL.sat.on;
    btn.setAttribute('aria-checked', String(SCHOOL.sat.on));
    document.getElementById('sat-times').hidden = !SCHOOL.sat.on;
    onScheduleChanged();
  }

  function onBoundsChange(input){
    var b = dayBounds();
    if(!TIME_RE.test(input.value) || b.start >= b.end){
      input.value = DEFAULT_BOUNDS[input.id];
      toast(t('toast.windowOrder'));
    }
    onScheduleChanged();
  }

  function scheduleSummary(){
    var txt = t('sum.week', { t: SCHOOL.week.entry + '–' + SCHOOL.week.exit });
    if(SCHOOL.sat.on){ txt += ' · ' + t('sum.sat', { t: SCHOOL.sat.entry + '–' + SCHOOL.sat.exit }); }

  }

  function onScheduleChanged(){
    var summary = scheduleSummary();
    document.querySelectorAll('.school-note').forEach(function(el){ el.innerHTML = t('note.school', { summary: summary }); });
    renderCover();
    var b = dayBounds();
    CAL_START = Math.floor(toHours(b.start));
    CAL_END = Math.ceil(toHours(b.end));
    renderCalendar(calView);
    fitCalendar();
    updateConfigSummaries();
