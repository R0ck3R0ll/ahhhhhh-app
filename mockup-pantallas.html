<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AHHHHHH!!!!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Fondo claro u oscuro según Configuración > Apariencia (no sigue el modo del sistema) */
  :root{
    --bg:#D9D9D9;
    --surface:#FFFFFF;
    --surface-alt:#ECECEA;
    --border:#C9C7C2;
    --text:#2B2925;
    --text-muted:#6F6A62;
    --accent:#B34567;
    --accent-strong:#942F4D;
    --accent-soft:#F2DDE3;
    --on-accent:#FFF3F0;
    --alert-bg:#4a2f2a;
    --alert-text:#f0c9bd;
    --alert-body-text:#e3b6a8;
    --alert-border:#6b453d;
    --cat-tarea:#5fb8b0;      --cat-tarea-ink:#0e8077;
    --cat-cita:#a08bd8;       --cat-cita-ink:#6a4aa8;
    --cat-actividad:#8bb06a;  --cat-actividad-ink:#557b3d;
    --cat-libre:#6f95c4;      --cat-libre-ink:#3e6899;
    --warn-bg:#e8b839;
    --warn-text:#2b1d02;
    --warn-ink:#8a6a12;
    --danger-bg:#ef4b4b;
    --danger-text:#fff5f4;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 26px rgba(0,0,0,.10);
    --font-display:'Fraunces', serif;
    --font-body:'IBM Plex Sans', system-ui, sans-serif;
    /* Trazo de dibujo (post-its y barra de la niña) y tinta sobre post-its de color */
    --ink:#2B2925;
    --cat-tarea-deep:#0b3431; --cat-cita-deep:#271a47; --cat-actividad-deep:#1f3312; --cat-libre-deep:#14263d;
  }
  /* Fondo oscuro: paleta de Design.html */
  :root[data-theme="dark"]{
    --bg:#322e2b;
    --surface:#47413a;
    --surface-alt:#3c3732;
    --border:#5c554c;
    --text:#f5f0e8;
    --text-muted:#b3a99b;
    --accent:#d6738a;
    --accent-strong:#e896aa;
    --accent-soft:rgba(214,115,138,.18);
    --on-accent:#2b1a1f;
    --cat-tarea-ink:#5fb8b0;
    --cat-cita-ink:#a08bd8;
    --cat-actividad-ink:#8bb06a;
    --cat-libre-ink:#6f95c4;
    --warn-ink:#e8b839;
    --ink:#15120f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .page-pad{ width:100%; display:flex; justify-content:center; padding:32px 16px 48px; }

  .app-shell{
    width:100%;
    max-width:428px;
    background:var(--bg);
    border-radius:28px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:780px;
  }

  .topbar{
    padding:20px 20px 16px;
    border-bottom:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .topbar .brand{
    font-family:var(--font-body);
    font-weight:600;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .topbar h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:32px;
    margin:2px 0 0;
    text-wrap:balance;
  }
  .topbar .subtitle{
    font-size:13px;
    color:var(--text-muted);
    margin-top:2px;
  }

  main.screen-container{
    flex:1;
    overflow-y:auto;
    padding:18px 18px 100px;
  }
  .screen{ display:none; flex-direction:column; gap:20px; }

  /* En el móvil la App ocupa toda la pantalla (sin el marco de teléfono de la maqueta):
     cabecera y barra de pestañas fijas, y solo el contenido de cada pantalla se desplaza. */
  @media (max-width:500px){
    body{ margin:0; min-height:100dvh; }
    .page-pad{ padding:0; }
    .app-shell{ max-width:none; height:100dvh; min-height:0; border:none; border-radius:0; box-shadow:none; }
    main.screen-container{ min-height:0; padding-bottom:18px; }
  }
  .screen.active{ display:flex; }

  h2.section-title{
    font-family:var(--font-body);
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:0 0 10px;
  }

  /* ---- Alert banner ---- */
  .alert{
    background:var(--alert-bg);
    border:1px solid var(--alert-border);
    color:var(--alert-text);
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .alert svg{ flex:none; margin-top:2px; }
  .alert .alert-title{ font-weight:600; font-size:13.5px; }
  .alert .alert-body{ font-size:13px; margin-top:2px; line-height:1.4; color:var(--alert-body-text); }

  /* ---- Today: estructura común ---- */
  #screen-today.active{ min-height:100%; }
  #screen-today .alert{ margin-top:auto; }
  #screen-today[data-layout="postit2"] .alert{ border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  .today-layout{ display:flex; flex-direction:column; gap:20px; }
  .section-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px; }

  /* ---- Barra de tiempo «Puntos»: color de categoría + línea en la hora actual ---- */
  @keyframes needlePulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(43,41,37,.5); } 70%{ box-shadow:0 0 0 10px rgba(43,41,37,0); } }
  @keyframes amberPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(232,184,57,.65); } 70%{ box-shadow:0 0 0 12px rgba(232,184,57,0); } }
  .day-strip{ position:relative; height:78px; }
  .day-strip .bar{
    position:absolute; left:0; right:0; top:32px; height:12px; border-radius:999px;
    background:linear-gradient(90deg, #f0c9a0 0%, #f5e0a8 32%, #e0a06a 62%, #4a3a5a 85%, #2a2438 100%);
  }
  .day-strip .marker{ position:absolute; border-radius:50%; transform:translateX(-50%); }
  .day-strip .marker.at-end{ transform:translateX(-100%); }
  .day-strip .stem{ position:absolute; width:1px; transform:translateX(-50%); }
  .day-strip .stem.at-end{ transform:translateX(-100%); }
  .day-strip .now-line{ position:absolute; top:0; width:3px; border-radius:2px; background:var(--text); transform:translateX(-50%); }
  .day-strip .now-dot{ position:absolute; border-radius:50%; background:var(--text); transform:translateX(-50%); animation:needlePulse 2s ease-out infinite; }
  .day-strip .now-label{ position:absolute; transform:translateX(-50%); font-size:10px; font-weight:700; color:var(--text); white-space:nowrap; }
  .day-strip .now-label.at-start{ transform:translateX(-6px); }
  .day-strip .now-label.at-end{ transform:translateX(calc(-100% + 6px)); }
  .day-strip-scale{ position:relative; display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted); margin-top:4px; font-variant-numeric:tabular-nums; }
  .day-strip-scale .scale-school{ position:absolute; top:0; white-space:nowrap; }
  /* Tramo del cole: hueco rayado sobre la barra */
  .day-strip .school-gap{
    position:absolute; top:28px; height:20px; border-radius:6px;
    border:1px solid var(--border);
    background:repeating-linear-gradient(135deg, var(--surface-alt), var(--surface-alt) 4px, var(--border) 4px, var(--border) 5px);
  }
  .day-strip .school-icon{ position:absolute; bottom:30px; transform:translateX(-50%); height:auto; overflow:visible; }

  /* ---- Barra de tiempo «Niña soldado»: el camino del día ---- */
  .timeline svg{ display:block; width:100%; height:auto; overflow:visible; }
  .tl-label{ font-family:var(--font-body); font-size:10px; font-weight:700; fill:var(--text); font-variant-numeric:tabular-nums; }
  .tl-label.is-muted{ fill:var(--text-muted); font-weight:500; }
  .tl-label.is-now{ fill:var(--accent-strong); }
  .boom{ transform-box:fill-box; transform-origin:center; animation:boomIdle var(--dur,2.6s) ease-in-out infinite; animation-delay:var(--delay,0s); }
  .boom.is-next{ animation:boomBig 2.4s cubic-bezier(.3,1.6,.5,1) infinite; }
  @keyframes boomIdle{ 0%,100%{ transform:scale(1) rotate(0deg); } 50%{ transform:scale(1.08) rotate(5deg); } }
  @keyframes boomBig{
    0%{ transform:scale(.8) rotate(0deg); }
    14%{ transform:scale(1.24) rotate(-8deg); }
    30%{ transform:scale(1) rotate(2deg); }
    100%{ transform:scale(.8) rotate(0deg); }
  }
  .spark{ opacity:0; animation:spark 2.4s ease-out infinite; }
  @keyframes spark{
    0%,10%{ opacity:0; transform:translate(0,0); }
    16%{ opacity:1; }
    55%{ opacity:0; transform:translate(var(--sx),var(--sy)); }
    100%{ opacity:0; transform:translate(var(--sx),var(--sy)); }
  }
  .w-bob{ animation:bob .45s ease-in-out infinite alternate; }
  .ponytail{ transform-box:fill-box; transform-origin:100% 50%; animation:swing-hair .45s ease-in-out infinite alternate; }
  @keyframes bob{ from{ transform:translateY(0); } to{ transform:translateY(-1.4px); } }
  @keyframes swing-hair{ from{ transform:rotate(-14deg); } to{ transform:rotate(16deg); } }

  /* ---- Tema «Lista» ---- */
  .up-next-card{ border-radius:20px; padding:17px 19px; background:var(--warn-bg); color:var(--warn-text); }
  .up-next-time{ font-family:var(--font-display); font-weight:700; font-size:28px; }
  .up-next-title{ font-family:var(--font-display); font-weight:600; font-size:18px; }
  .up-next-sub{ font-size:12.5px; font-weight:600; margin-top:6px; }
  .later-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .later-chip{
    border-radius:14px; padding:10px 14px; flex:1; min-width:152px;
    background:color-mix(in srgb, var(--c) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--c) 40%, transparent);
  }
  .later-time{ font-size:11px; font-weight:700; color:var(--c-ink); }
  .later-title{ font-size:12.5px; font-weight:600; margin-top:3px; }
  .later-sub{ font-size:10.5px; color:var(--text-muted); margin-top:2px; }

  /* ---- Tema «Post-it 1» (Design.html · Siguiente ahora): protagonista + baraja ---- */
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.015); } }
  @keyframes glowPulse{ 0%,100%{ box-shadow:0 0 0 rgba(232,184,57,0), 0 16px 34px rgba(0,0,0,.22); } 50%{ box-shadow:0 0 46px rgba(232,184,57,.5), 0 16px 34px rgba(0,0,0,.22); } }
  @keyframes bob1{ 0%,100%{ transform:translateY(0) rotate(-7deg); } 50%{ transform:translateY(-7px) rotate(-7deg); } }
  @keyframes bob2{ 0%,100%{ transform:translateY(0) rotate(5deg); } 50%{ transform:translateY(-10px) rotate(5deg); } }
  @keyframes bob3{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-6px) rotate(-3deg); } }
  .hero-eyebrow{ text-align:center; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }
  .hero-card{
    background:var(--warn-bg); color:var(--warn-text); border-radius:26px; padding:26px 24px; text-align:center;
    animation:glowPulse 3.2s ease-in-out infinite, breathe 3.2s ease-in-out infinite;
  }
  .hero-time{ font-family:var(--font-display); font-weight:700; font-size:52px; line-height:1; }
  .hero-title{ font-family:var(--font-display); font-weight:600; font-size:24px; margin-top:6px; }
  .hero-place{ font-size:13px; font-weight:600; margin-top:10px; opacity:.85; }
  .hero-leave{
    display:inline-flex; align-items:center; gap:6px; margin-top:14px;
    background:rgba(0,0,0,.14); font-weight:700; font-size:12.5px; padding:7px 14px; border-radius:999px;
  }
  .fan{ display:flex; align-items:center; justify-content:center; padding:8px 0 10px; }
  .fan-card{
    position:relative; flex:none; width:112px; min-height:134px; margin-right:-16px;
    background:var(--surface); border:1px solid var(--c); border-radius:16px; padding:13px;
    box-shadow:var(--shadow);
  }
  .fan-card:last-child{ margin-right:0; }
  .fan-card:nth-child(3n+1){ animation:bob1 3.6s ease-in-out infinite; }
  .fan-card:nth-child(3n+2){ animation:bob2 4.1s ease-in-out infinite; }
  .fan-card:nth-child(3n+3){ animation:bob3 3.8s ease-in-out infinite; }
  .fan-time{ font-size:11px; font-weight:700; color:var(--c-ink); }
  .fan-title{ font-size:13px; font-weight:700; margin-top:5px; line-height:1.2; hyphens:auto; overflow-wrap:break-word; }
  .fan-sub{ font-size:10.5px; color:var(--text-muted); margin-top:4px; }

  /* ---- Tema «Post-it 2» (boceto-today.html): barra del próximo + post-its flotantes ---- */
  .pi-next{
    position:relative; overflow:hidden; flex:none;
    display:flex; align-items:center; gap:12px;
    background:var(--warn-bg); color:var(--warn-text);
    border:2px solid var(--ink); border-radius:16px;
    box-shadow:0 3px 0 var(--ink);
    padding:11px 16px;
  }
  .pi-next::after{
    content:""; position:absolute; top:0; bottom:0; left:-60%; width:40%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    animation:sheen 6s ease-in-out infinite; pointer-events:none;
  }
  @keyframes sheen{ 0%,70%{ left:-60%; } 100%{ left:130%; } }
  .pi-next-time{ font-family:var(--font-display); font-weight:700; font-size:24px; line-height:1; font-variant-numeric:tabular-nums; }
  .pi-next-title{ flex:1; min-width:0; font-family:var(--font-display); font-weight:600; font-size:18px; line-height:1.1; }
  .pi-next-side{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; text-align:right; }
  .pi-next-when{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .pi-next-leave{ display:flex; align-items:center; gap:4px; font-size:12px; font-weight:600; }

  .board{ position:relative; flex:none; height:384px; }
  .note{
    position:absolute; width:min(56%, 188px); min-height:150px;
    left:var(--x); top:var(--y); z-index:var(--z);
    transform:rotate(var(--rot));
    transition:left .8s cubic-bezier(.34,1.25,.5,1), top .8s cubic-bezier(.34,1.25,.5,1), transform .8s cubic-bezier(.34,1.25,.5,1);
    animation:noteIn .9s cubic-bezier(.2,.9,.3,1.15) backwards;
    animation-delay:var(--in-delay, 0s);
    cursor:pointer; outline:none;
  }
  @keyframes noteIn{
    from{ opacity:0; transform:translateY(-40px) rotate(calc(var(--rot) - 14deg)) scale(.9); }
    to{ opacity:1; transform:translateY(0) rotate(var(--rot)) scale(1); }
  }
  .note-shadow{
    position:absolute; left:14%; right:14%; bottom:-22px; height:18px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(20,18,15,.34), rgba(20,18,15,0));
    animation:shadowFloat var(--dur) ease-in-out infinite; animation-delay:var(--delay);
  }
  .note-card{
    position:relative; min-height:150px;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:13px 15px; border-radius:22px;
    border:1.5px solid rgba(43,41,37,.8);
    background:linear-gradient(160deg, rgba(255,255,255,.32), rgba(255,255,255,0) 48%), var(--c);
    color:var(--deep);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 10px 20px rgba(0,0,0,.10);
    animation:float var(--dur) ease-in-out infinite; animation-delay:var(--delay);
  }
  @keyframes float{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-10px) rotate(var(--sway)); } }
  @keyframes shadowFloat{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(.76); opacity:.5; } }
  .note:focus-visible .note-card{ outline:3px solid var(--accent); outline-offset:3px; }
  .n-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .n-cat{ font-size:9px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; opacity:.75; }
  .n-time{ font-family:var(--font-display); font-weight:700; font-size:26px; line-height:1; font-variant-numeric:tabular-nums; }
  .n-title{ font-family:var(--font-display); font-weight:600; font-size:15.5px; line-height:1.15; margin-top:3px; }
  .n-meta{ font-size:11px; font-weight:500; opacity:.82; margin-top:3px; }
  .n-travel{ display:flex; gap:5px; margin-top:8px; }
  .n-pill{
    font-family:var(--font-body); font-size:10.5px; font-weight:600;
    padding:4px 8px; border-radius:999px; cursor:pointer; white-space:nowrap;
    border:1px solid rgba(43,41,37,.35); background:rgba(255,255,255,.45); color:var(--deep);
  }
  .n-pill.is-on{ background:#2B2925; border-color:#2B2925; color:#fff; }
  .n-pill:focus-visible{ outline:2px solid #2B2925; outline-offset:2px; }
  .n-leave{ display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; margin-top:5px; }

  @media (prefers-reduced-motion: reduce){
    .now-dot, .pulse-amber, .boom, .spark, .w-bob, .ponytail, .hero-card, .fan-card,
    .pi-next::after, .note, .note-card, .note-shadow{ animation:none !important; }
    .note{ transition-duration:.01s; }
  }

  .chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600;
    padding:3px 8px; border-radius:999px;
    background:var(--surface-alt); color:var(--text-muted);
    border:1px solid var(--border);
    width:fit-content;
  }

  .travel-note{
    margin-top:6px;
    display:flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:500;
    color:var(--accent-strong);
    background:var(--accent-soft);
    border-radius:8px;
    padding:6px 9px;
    width:fit-content;
  }
  .travel-note svg{ flex:none; }

  .toggle-row{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .toggle-btn{
    font-family:var(--font-body);
    font-size:12px; font-weight:600;
    padding:5px 10px; border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    cursor:pointer;
  }
  .toggle-btn.is-active{
    background:var(--accent); border-color:var(--accent); color:var(--on-accent);
  }
  .toggle-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---- Rows (Activities / Events / Config) ---- */
  .row-list{ display:flex; flex-direction:column; }
  .row{
    display:flex; align-items:center; gap:12px;
    padding:13px 0;
    border-bottom:1px solid var(--border);
  }
  .row:last-child{ border-bottom:none; }
  .row-bar{ width:4px; align-self:stretch; border-radius:3px; flex:none; }
  .row-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .row-title{ font-weight:600; font-size:14.5px; }
  .row-sub{ font-size:12.5px; color:var(--text-muted); display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .row-sub svg{ flex:none; }
  .row-action{
    flex:none; border:none; background:none; color:var(--accent);
    font-family:var(--font-body); font-weight:600; font-size:12.5px;
    padding:6px 4px; cursor:pointer; border-radius:6px;
  }
  .row-action:hover{ background:var(--accent-soft); }
  .row-action:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .add-btn{
    font-family:var(--font-body); font-weight:600; font-size:13.5px;
    color:var(--accent-strong);
    background:var(--accent-soft);
    border:1px dashed var(--accent);
    border-radius:12px;
    padding:12px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .add-btn:hover{ filter:brightness(1.03); }
  .add-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .context-note{
    display:flex; align-items:flex-start; gap:8px;
    background:var(--surface-alt); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px;
    font-size:12.5px; color:var(--text-muted); line-height:1.4;
  }
  .context-note svg{ flex:none; margin-top:1px; color:var(--accent-strong); }
  .context-note strong{ color:var(--text); }

  /* ---- Config specific ---- */
  .config-card{
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    background:var(--surface-alt);
    display:flex; flex-direction:column; gap:10px;
  }
  .config-line{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .config-label{ font-size:13.5px; font-weight:500; }
  .config-value{ font-size:12.5px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .status-chip{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px;
  }
  .status-chip.off{ background:var(--surface); color:var(--text-muted); border:1px solid var(--border); }
  .btn-primary{
    font-family:var(--font-body); font-weight:600; font-size:12.5px;
    background:var(--accent); color:var(--on-accent); border:none;
    padding:7px 13px; border-radius:9px; cursor:pointer;
  }
  .btn-primary:hover{ background:var(--accent-strong); }
  .btn-primary:focus-visible{ outline:2px solid var(--accent-strong); outline-offset:2px; }
  .btn-ghost{
    font-family:var(--font-body); font-weight:600; font-size:12.5px;
    background:transparent; color:var(--accent-strong); border:1px solid var(--border);
    padding:7px 13px; border-radius:9px; cursor:pointer;
  }

  .card-hint{ font-size:12.5px; color:var(--text-muted); line-height:1.4; margin:0; }
  .card-hint strong{ color:var(--text); font-weight:600; }
  .field-label{ font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); }

  /* ---- Interruptor on/off ---- */
  .switch{
    flex:none; position:relative; width:38px; height:22px; padding:0;
    border-radius:999px; border:1px solid var(--border); background:var(--surface);
    cursor:pointer; transition:background .15s ease, border-color .15s ease;
  }
  .switch::after{
    content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:var(--text-muted); transition:transform .15s ease;
  }
  .switch[aria-checked="true"]{ background:var(--accent); border-color:var(--accent); }
  .switch[aria-checked="true"]::after{ transform:translateX(16px); background:var(--on-accent); }
  .switch:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ .switch, .switch::after{ transition:none; } }

  /* ---- Franja horaria y horario escolar ---- */
  .time-input{
    font-family:var(--font-body); font-size:13px; font-variant-numeric:tabular-nums; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:5px 6px; width:84px; min-width:0; text-align:center;
  }
  .time-input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  /* Sin icono de reloj: en el móvil el selector se abre al tocar y así caben las horas */
  .time-input::-webkit-calendar-picker-indicator{ display:none; }
  .time-line{ flex-wrap:wrap; }
  .time-line[hidden]{ display:none; }
  .time-pair{ display:flex; align-items:center; gap:6px; color:var(--text-muted); }
  .cover-block{ display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--border); padding-top:12px; }
  .cover-list{ display:flex; flex-direction:column; gap:4px; }
  .cover-list .config-value{ color:var(--cat-libre-ink); font-weight:600; text-align:right; }

  /* ---- Exportación a Google Calendar ---- */
  .export-options{ display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--border); padding-top:12px; }
  .export-options[hidden]{ display:none; }
  .check-list{ display:flex; flex-direction:column; gap:2px; }
  .check-row{ display:flex; align-items:center; gap:9px; font-size:13.5px; padding:5px 0; cursor:pointer; }
  .check-row input{ width:16px; height:16px; margin:0; accent-color:var(--accent); flex:none; }
  .check-row .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  /* ---- Configuración: bloques plegables ---- */
  .cfg-groups{ display:flex; flex-direction:column; gap:10px; }
  .cfg-group{ border:1px solid var(--border); border-radius:14px; background:var(--surface-alt); }
  .cfg-group > summary{
    list-style:none; display:flex; align-items:center; gap:10px;
    padding:14px; cursor:pointer; border-radius:14px;
  }
  .cfg-group > summary::-webkit-details-marker{ display:none; }
  .cfg-group > summary:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .cfg-group-title{ flex:none; font-family:var(--font-display); font-weight:600; font-size:16px; }
  .cfg-group-sum{ flex:1; min-width:0; text-align:right; font-size:12px; line-height:1.3; color:var(--text-muted); }
  .cfg-group .chev{ flex:none; color:var(--text-muted); transition:transform .2s ease; }
  .cfg-group[open] .chev{ transform:rotate(180deg); }
  .cfg-group[open] > summary{ border-bottom:1px solid var(--border); border-radius:14px 14px 0 0; }
  .cfg-group-body{ padding:14px; display:flex; flex-direction:column; gap:14px; }
  /* Dentro de un bloque, las tarjetas pierden su marco */
  .cfg-group .config-card{ border:none; background:none; padding:0; }
  .cfg-sub{ display:flex; flex-direction:column; gap:10px; }
  .cfg-sub + .cfg-sub{ border-top:1px solid var(--border); padding-top:14px; }
  .cfg-sub-title{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-strong); }
  @media (prefers-reduced-motion: reduce){ .cfg-group .chev{ transition:none; } }
  .lang-select{
    font-family:var(--font-body); font-size:13px; font-weight:600; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 8px;
  }
  .lang-select:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .status-chip.pending{ background:var(--accent-soft); color:var(--accent-strong); border:1px solid var(--accent); }

  /* ---- Editable categories ---- */
  .cat-row{ align-items:center; }
  .swatch{ border:none; cursor:pointer; padding:0; }
  .swatch:hover{ filter:brightness(1.1); }
  .swatch:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .cat-name-input{
    font-family:var(--font-body); font-weight:600; font-size:14.5px; color:var(--text);
    background:transparent; border:none; border-bottom:1px solid transparent;
    padding:2px 0; width:100%; min-width:0;
  }
  .cat-name-input:hover{ border-bottom-color:var(--border); }
  .cat-name-input[readonly]{ cursor:default; }
  .cat-name-input[readonly]:hover, .cat-name-input[readonly]:focus{ border-bottom-color:transparent; }
  .cat-name{ font-weight:600; font-size:14.5px; padding:2px 0; }
  /* El color solo se cambia mientras se edita la categoría */
  .cat-row:not(.is-editing) .swatch{ pointer-events:none; }
  .cat-row.is-editing .swatch{ box-shadow:0 0 0 2px var(--surface-alt), 0 0 0 3px var(--accent); }
  .cat-name-input:focus{ outline:none; border-bottom-color:var(--accent); }
  .priority-select{
    flex:none;
    font-family:var(--font-body); font-weight:700; font-size:11px; color:#2B2925;
    border:none; border-radius:999px; padding:4px 22px 4px 10px;
    cursor:pointer;
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232B2925' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 6px center; background-size:11px;
  }
  .priority-select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .priority-select option{ color:var(--text); background:var(--surface); font-weight:500; }
  .row-delete{
    flex:none; width:24px; height:24px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface);
    color:var(--text-muted); font-size:15px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .row-edit{
    flex:none; width:24px; height:24px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface);
    color:var(--text-muted); cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .row-edit:hover{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }
  .row-edit:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .cat-row.is-editing .row-edit{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .row-delete:hover{ background:var(--alert-bg); border-color:var(--alert-border); color:var(--alert-text); }
  .row-delete:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  /* ---- Calendar ---- */
  .seg-control{ display:flex; background:var(--surface-alt); border:1px solid var(--border); border-radius:10px; padding:3px; gap:3px; }
  .seg-btn{
    flex:1; border:none; background:none; cursor:pointer;
    font-family:var(--font-body); font-weight:600; font-size:13px; color:var(--text-muted);
    padding:7px; border-radius:8px;
  }
  .seg-btn.is-active{ background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow); }
  .seg-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  /* La página cabe sin scroll: controles en una fila, horario escolar comprimido */
  .screen-container:has(#screen-calendar.active){ padding-bottom:18px; }
  #screen-calendar{ gap:12px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cal-head .seg-control{ flex:none; }
  .cal-head .seg-btn{ flex:none; padding:5px 12px; }
  .cal-nav{ display:flex; align-items:center; gap:8px; min-width:0; }
  .nav-arrow{
    flex:none; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    width:26px; height:26px; border-radius:8px; font-size:14px; line-height:1; cursor:pointer;
  }
  .nav-arrow:hover{ background:var(--surface-alt); }
  .cal-range{ font-size:12.5px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .cal-legend{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--text-muted); }
  .cal-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .cal-legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }

  .cal-grid{ display:grid; }
  .cal-daylabel{
    text-align:center; font-size:11px; font-weight:600; color:var(--text-muted);
    padding-bottom:4px; display:flex; align-items:baseline; justify-content:center; gap:3px;
  }
  .cal-daylabel.is-today{ color:var(--accent-strong); }
  .cal-daylabel .dl-date{ font-size:12px; font-variant-numeric:tabular-nums; }

  .cal-hourcol{ position:relative; }
  .cal-hourlabel{
    position:absolute; right:6px; transform:translateY(-50%);
    font-size:9.5px; color:var(--text-muted); font-variant-numeric:tabular-nums;
  }
  .cal-hourlabel:first-child{ transform:none; }
  .cal-hourlabel.is-last{ transform:translateY(-100%); }
  .cal-school-icon{ position:absolute; left:50%; width:30px; height:auto; transform:translate(-50%, -50%); overflow:visible; }

  .cal-daycol{ position:relative; border-left:1px solid var(--border); }
  .cal-daycol.is-today{ background-color:var(--accent-soft); }
  .cal-hourline{ position:absolute; left:0; right:0; height:1px; background:var(--border); }

  /* Horario escolar: tramo comprimido y rayado (igual que en la barra de Today) */
  .school-band{
    position:absolute; left:0; right:0; opacity:.8;
    border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    background:repeating-linear-gradient(135deg, transparent, transparent 4px, var(--border) 4px, var(--border) 5px);
    font-size:9px; color:var(--text-muted); display:flex; align-items:center; justify-content:center;
  }
  .school-band span{ background:var(--surface-alt); padding:0 5px; border-radius:4px; }

  .cal-bar{
    position:absolute; left:2px; right:2px; border-radius:5px; padding:2px 4px; min-height:14px;
    overflow:hidden; display:flex; flex-direction:column; justify-content:flex-start;
    font-size:10.5px; color:#2B2925; line-height:1.15;
  }
  .cal-bar .bar-title{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-bar .bar-time{ font-size:9.5px; opacity:.85; font-variant-numeric:tabular-nums; }
  .cal-bar.cat-actividad{ background:var(--cat-actividad); }
  .cal-bar.cat-libre{ background:var(--cat-libre); }
  .cal-bar.cat-cita{ background:var(--cat-cita); }

  .cal-deadline{ position:absolute; left:2px; right:2px; display:flex; align-items:center; gap:4px; transform:translateY(-50%); z-index:2; }
  .cal-deadline .dl-dot{ width:9px; height:9px; border-radius:50%; background:var(--cat-tarea); border:2px solid var(--surface); flex:none; }
  .cal-deadline .dl-label{
    font-size:9.5px; font-weight:600; color:var(--cat-tarea-ink); background:var(--surface);
    padding:1px 4px; border-radius:4px; white-space:nowrap;
  }

  /* ---- Tab bar ---- */
  .tabbar{
    position:sticky; bottom:0;
    display:grid; grid-template-columns:repeat(5,1fr);
    border-top:1px solid var(--border);
    background:var(--surface);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; cursor:pointer;
    color:var(--text-muted);
    font-family:var(--font-body); font-size:10px; font-weight:600;
    padding:6px 1px; border-radius:10px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .tab svg{ flex:none; }
  .tab.is-active{ color:var(--accent); }
  .tab:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px);
    background:var(--text); color:var(--bg);
    padding:10px 16px; border-radius:10px; font-size:13px; font-weight:500;
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
    max-width:90vw; text-align:center; z-index:20;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion: reduce){
    .toast{ transition:none; }
  }
</style>
</head>
<body>
<div class="page-pad">
<div class="app-shell">

  <div class="topbar">
    <span class="brand">AHHHHHH!!!!!</span>
    <h1 id="screen-heading">Today</h1>
    <span class="subtitle" id="screen-subheading"></span>
  </div>

  <main class="screen-container">

    <!-- ============ TODAY ============ -->
    <section class="screen active" id="screen-today" aria-labelledby="screen-heading">

      <!-- Barra de tiempo y tema: se dibujan según Configuración > Apariencia de Today -->
      <div id="today-bar"></div>
      <div class="today-layout" id="today-layout"></div>

      <div class="alert" role="status">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
        <div>
          <div class="alert-title" data-i18n="alert.title"></div>
          <div class="alert-body" id="alert-body"></div>
        </div>
      </div>

    </section>

    <!-- ============ ACTIVIDADES ============ -->
    <section class="screen" id="screen-activities" aria-labelledby="screen-heading">
      <div class="context-note">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span class="school-note"></span>
      </div>

      <div>
        <h2 class="section-title" data-i18n="act.title"></h2>
        <div class="row-list">

          <div class="row">
            <div class="row-body">
              <span class="row-title" style="color:var(--cat-actividad-ink)">Natación</span>
              <span class="row-sub"><span><span data-days="0,4"></span> · 18:00–19:00</span>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                Piscina Municipal Las Rozas</span>
            </div>
            <button class="row-action" onclick="toast(t('toast.editAct'))" data-i18n="edit"></button>
          </div>

          <div class="row">
            <div class="row-body">
              <span class="row-title" style="color:var(--cat-actividad-ink)">Inglés</span>
              <span class="row-sub"><span><span data-days="1"></span> · 17:00–18:00</span>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                Academia Oxford Las Rozas</span>
            </div>
            <button class="row-action" onclick="toast(t('toast.editAct'))" data-i18n="edit"></button>
          </div>

          <div class="row">
            <div class="row-body">
              <span class="row-title" style="color:var(--cat-actividad-ink)">Piano</span>
              <span class="row-sub"><span><span data-days="3"></span> · 17:30–18:15</span> · <span data-i18n="noTravel"></span></span>
            </div>
            <button class="row-action" onclick="toast(t('toast.editAct'))" data-i18n="edit"></button>
          </div>

        </div>
      </div>

      <button class="add-btn" onclick="toast(t('toast.addAct'))">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span data-i18n="act.add"></span>
      </button>
    </section>

    <!-- ============ EVENTOS ============ -->
    <section class="screen" id="screen-events" aria-labelledby="screen-heading">

      <div class="context-note">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span class="school-note"></span>
      </div>

      <div>
        <h2 class="section-title" data-i18n="evt.upcoming"></h2>
        <div class="row-list">
          <div class="row">
            <div class="row-body">
              <span class="row-title" style="color:var(--cat-libre-ink)">Cumpleaños de Sofía</span>
              <span class="row-sub"><span><span data-date="2026-09-12"></span> · 17:00 · Bowling Las Rozas</span></span>
            </div>
            <button class="row-action" onclick="toast(t('toast.editEvt'))" data-i18n="edit"></button>
          </div>
          <div class="row">
            <div class="row-body">
              <span class="row-title" style="color:var(--cat-cita-ink)">Revisión dental</span>
              <span class="row-sub"><span><span data-date="2026-09-16"></span> · 10:00 · Clínica Dental Sonrisas</span></span>
            </div>
            <button class="row-action" onclick="toast(t('toast.editEvt'))" data-i18n="edit"></button>
          </div>
        </div>
      </div>

      <div>
        <h2 class="section-title" data-i18n="evt.free"></h2>
        <div class="row-list">
          <div class="row">
            <div class="row-body">
              <span class="row-title" style="color:var(--cat-libre-ink)">Tarde libre</span>
              <span class="row-sub"><span><span data-date="2026-09-12"></span> · 15:00–17:00</span></span>
            </div>
            <button class="row-action" onclick="toast(t('toast.editEvt'))" data-i18n="edit"></button>
          </div>
        </div>
      </div>

      <button class="add-btn" onclick="toast(t('toast.addEvt'))">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span data-i18n="evt.add"></span>
      </button>
    </section>

    <!-- ============ CONFIGURACIÓN ============ -->
    <section class="screen" id="screen-config" aria-labelledby="screen-heading">

      <div class="cfg-groups">
      <details class="cfg-group" data-group="language">
        <summary><span class="cfg-group-title" data-i18n="grp.language"></span><span class="cfg-group-sum" id="sum-language"></span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
        <div class="cfg-group-body">
        <div class="config-card">
          <div class="config-line">
            <label class="config-label" for="lang-select" data-i18n="cfg.languageLabel"></label>
            <select id="lang-select" class="lang-select" onchange="setLanguage(this.value)">
              <option value="es">Español</option>
              <option value="en">English</option>
              <option value="it">Italiano</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
            </select>
          </div>
          <p class="card-hint" data-i18n="cfg.languageHint"></p>
        </div>
        </div>
      </details>
      <details class="cfg-group" data-group="look">
        <summary><span class="cfg-group-title" data-i18n="grp.look"></span><span class="cfg-group-sum" id="sum-look"></span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
        <div class="cfg-group-body">
        <div class="config-card">
          <div class="field-label" data-i18n="cfg.theme"></div>
          <div class="seg-control" role="group" data-i18n-aria="cfg.themeAria">

  var LANG = 'es';

  function t(key, vars){
    var s = I18N[LANG][key];
    if(s == null){ s = I18N.es[key]; }
    if(s == null){ return key; }
    vars = vars || {};
    if(vars.name == null){ vars.name = KID; }
    return s.replace(/\{(\w+)\}/g, function(m, k){ return vars[k] != null ? vars[k] : m; });
  }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function fmtDate(d, opts){ return new Intl.DateTimeFormat(LOCALES[LANG], opts).format(d); }
  function isoDate(iso){ var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function ddmm(d){ return (d.getDate() < 10 ? '0' : '') + d.getDate() + '/' + (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1); }
  // Nombre del día de la semana (lunes = 0); el 7/9/2026 es lunes
  function weekdayName(i, style){ return fmtDate(new Date(2026, 8, 7 + i), { weekday: style || 'long' }); }
  var TODAY_DATE = new Date(2026, 8, 11);
  function todaySubtitle(){
    return cap(fmtDate(TODAY_DATE, { weekday:'long', day:'numeric', month:'long' })) + ' · ' + t('planOf');
  }

  function loadLanguage(){
    try{ var l = localStorage.getItem('app-language'); if(l && I18N[l]){ LANG = l; } }catch(e){}
  }
  function setLanguage(l){
    if(!I18N[l]){ return; }
    LANG = l;
    try{ localStorage.setItem('app-language', l); }catch(e){}
    applyI18n();
  }

  // Aplica el idioma a todo lo que está en el HTML y vuelve a dibujar lo generado
  function applyI18n(){
    document.documentElement.lang = LANG;
    var sel = document.getElementById('lang-select');
    if(sel){ sel.value = LANG; }
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    document.querySelectorAll('[data-i18n-title]').forEach(function(el){ el.setAttribute('title', t(el.dataset.i18nTitle)); });
    document.querySelectorAll('.priority-select option').forEach(function(o){ o.textContent = t('prio.' + o.value); });
    // Días de la semana y fechas de los datos de ejemplo
    document.querySelectorAll('[data-days]').forEach(function(el){
      el.textContent = cap(el.dataset.days.split(',').map(function(d){ return weekdayName(+d); }).join(t('and')));
    });
    document.querySelectorAll('[data-date]').forEach(function(el){
      var d = isoDate(el.dataset.date);
      el.textContent = cap(fmtDate(d, { weekday:'short' }).replace('.', '')) + ' ' + ddmm(d);
    });
    var due = isoDate('2026-09-14');
    document.getElementById('alert-body').textContent = t('alert.body', {
      task:'Trabajo de Ciencias Naturales', est:'2 h', due: fmtDate(due, { weekday:'long' }) + ' ' + ddmm(due) });
    var active = document.querySelector('.tab.is-active');
    if(active){ setScreenHeading(active); }
    document.getElementById('cal-range').textContent = calRangeText(calView);
    renderExportCats();
    onScheduleChanged();
    applyAppearance();
  }

  // Escala de la barra: toda la franja horaria de hoy. En días de cole, el horario
  // escolar se dibuja como un tramo comprimido (SCHOOL_SHARE del ancho) y el resto
  // del ancho se reparte en proporción al tiempo fuera del cole.
  var SCHOOL_SHARE = 0.12;
  function todayScale(){
    var b = dayBounds(), sc = schoolFor(TODAY_DAY);
    var start = toHours(b.start), end = toHours(b.end), school = null;
    var segs = [{ from:start, to:end }];
    if(sc.on){
      var a = Math.max(toHours(sc.entry), start), z = Math.min(toHours(sc.exit), end);
      if(a < z){
        school = { from:a, to:z };
        segs = [{ from:start, to:a }, { from:a, to:z, school:true }, { from:z, to:end }]
          .filter(function(g){ return g.to > g.from; });
      }
    }
    var outside = segs.reduce(function(sum, g){ return sum + (g.school ? 0 : g.to - g.from); }, 0);
    var x = 0;
    segs.forEach(function(g){
      g.w = g.school ? (outside ? SCHOOL_SHARE : 1) : (1 - (school ? SCHOOL_SHARE : 0)) * (g.to - g.from) / outside;
      g.x = x; x += g.w;
    });
    function pos(t){
      if(t <= start){ return 0; }
      if(t >= end){ return 1; }
      for(var i = 0; i < segs.length; i++){
        var g = segs[i];
        if(t <= g.to){ return g.x + g.w * (t - g.from) / (g.to - g.from); }
      }
      return 1;
    }
    if(school){ school.x0 = pos(school.from); school.x1 = pos(school.to); }
    return { start:start, end:end, school:school, pos:pos };
  }

  function todayEvents(){
    return [ {t:TODAY_NEXT.t, cat:TODAY_NEXT.cat, next:true} ].concat(TODAY_LATER.map(function(e){ return {t:e.t, cat:e.cat}; }))
      .sort(function(a, b){ return a.t - b.t; });
  }

    if(APPEARANCE.layout === 'postit1'){ renderPostit1(layout); }
    else if(APPEARANCE.layout === 'postit2'){ renderPostit2(layout); }
    else { renderList(layout); }

    if(hint){

    }
  }

  /* ---- Barra «Niña soldado» (de boceto-today.html) ---- */
  var TL_X0 = 20, TL_X1 = 304, TL_Y = 58;

  function seeded(seed){
    var v = seed;
    return function(){ v = (v * 9301 + 49297) % 233280; return v / 233280; };
  }

  function boomPoints(seed, rOut, rIn, spikes){
    var rnd = seeded(seed), pts = [];
    for(var k = 0; k < spikes * 2; k++){
      var a = (k + (rnd() - .5) * .5) * Math.PI / spikes - Math.PI / 2;
      var rad = k % 2 ? rIn * (.85 + rnd() * .3) : rOut * (.72 + rnd() * .5);
      pts.push((Math.cos(a) * rad).toFixed(2) + ',' + (Math.sin(a) * rad).toFixed(2));
    }
    return pts.join(' ');
  }

  function explosion(e, i, x){
    var big = !!e.next, color = catColor(e.cat), sparks = '';
    if(big){
      for(var k = 0; k < 6; k++){
        var a = k / 6 * Math.PI * 2 + .3;
        sparks += '<g class="spark" style="--sx:' + (Math.cos(a) * 17).toFixed(1) + 'px;--sy:' + (Math.sin(a) * 17).toFixed(1) + 'px">' +
          '<circle r="' + (k % 2 ? 1.1 : 1.6) + '" fill="' + (k % 2 ? '#ffe066' : color) + '" stroke="var(--ink)" stroke-width=".6"/></g>';
      }
    }
    return '<g transform="translate(' + x.toFixed(1) + ' ' + TL_Y + ')">' + sparks +
      '<g class="boom' + (big ? ' is-next' : '') + '" style="--dur:' + (2.6 + i * .45) + 's;--delay:' + (-i * .7) + 's">' +
        '<polygon points="' + boomPoints(7 + i * 13, big ? 18 : 14.5, 7.5, 11) + '" fill="' + color + '" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/>' +
        '<polygon points="' + boomPoints(3 + i * 29, big ? 9.5 : 7.5, 4.4, 9) + '" fill="' + (big ? '#ffe066' : '#fff4c2') + '" stroke="var(--ink)" stroke-width=".9" stroke-linejoin="round"/>' +
      '</g></g>';
  }

  // Extremidad articulada en (x, y) que oscila entre `from` y `to` grados.
  function limb(x, y, len, w, color, from, to, tip){
    return '<g transform="translate(' + x + ' ' + y + ')"><g>' +
      '<animateTransform attributeName="transform" type="rotate" values="' + from + ';' + to + ';' + from + '" dur="0.9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>' +
      '<line x1="0" y1="0" x2="0" y2="' + len + '" stroke="var(--ink)" stroke-width="' + (w + 1.8) + '" stroke-linecap="round"/>' +
      '<line x1="0" y1="0" x2="0" y2="' + len + '" stroke="' + color + '" stroke-width="' + w + '" stroke-linecap="round"/>' +
      tip + '</g></g>';
  }

  function soldierGirl(){
    var OLIVE = '#6f7d3c', OLIVE_DARK = '#56622d', KHAKI = '#7d8a45', SKIN = '#f2c7a0', HAIR = '#6b3b1f';

    var hand = '<circle cx="0" cy="8.1" r="1.5" fill="' + SKIN + '" stroke="var(--ink)" stroke-width=".8"/>';

      '<circle cx="1" cy="-29.5" r="4.6" fill="' + SKIN + '" stroke="var(--ink)" stroke-width="1.3"/>' +

      '<path d="M-3.6 -29.8 q.6 4.6 4.4 5.2" fill="none" stroke="var(--ink)" stroke-width=".8"/>' +

      '<circle cx="3.8" cy="-33.1" r="1" fill="' + OLIVE_DARK + '"/>' +
      '<circle cx="-1.4" cy="-32.5" r=".8" fill="' + OLIVE_DARK + '"/>' +
      '<path d="M-2.2 -34.1 q2.4 -1.8 5 -.8" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".9" stroke-linecap="round"/>' +
      '<rect x="-6.2" y="-31.4" width="14.6" height="2" rx="1" fill="' + OLIVE_DARK + '" stroke="var(--ink)" stroke-width="1.1"/>' +
      limb(0.8, -12, 10.5, 3.2, OLIVE, -24, 24, boot) +
      limb(0.6, -21.5, 7.5, 2.6, KHAKI, 30, -30, hand) +
    '</g>';
  }

  function renderNinaBar(host, r){
    function xAt(t){ return TL_X0 + r.pos(t) * (TL_X1 - TL_X0); }
    var nowX = xAt(NOW), events = todayEvents();
    var inSchool = r.school && NOW > r.school.from && NOW < r.school.to;
    var track = 'M20 52 H316 V44 L338 58 L316 72 V64 H20 A6 6 0 0 1 20 52 Z';
    // Etiqueta de «ahora» a la izquierda de la niña; si no cabe, encima de ella.
    var nowLabel = inSchool
      ? '<text class="tl-label is-now" x="' + nowX.toFixed(1) + '" y="18" text-anchor="middle">' + t('today.inClass', { t: fmtHour(NOW) }) + '</text>'
      : nowX - 18 > 48 && !(r.school && NOW >= r.school.to && nowX - 50 < xAt(r.school.to))
      ? '<text class="tl-label is-now" x="' + (nowX - 18).toFixed(1) + '" y="42" text-anchor="end">' + fmtHour(NOW) + '</text>'
      : '<text class="tl-label is-now" x="' + nowX.toFixed(1) + '" y="-10" text-anchor="middle">' + fmtHour(NOW) + '</text>';
    var svg =
      '<svg viewBox="0 -22 350 116" role="img" aria-label="Ahora ' + fmtHour(NOW) + '; próximos: ' + events.map(function(e){ return fmtHour(e.t); }).join(', ') + '">' +
      '<defs>' +
        '<clipPath id="trackClip"><path d="' + track + '"/></clipPath>' +
        '<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
          '<rect width="6" height="6" fill="var(--accent-soft)"/>' +
          '<line x1="0" y1="0" x2="0" y2="6" stroke="var(--accent)" stroke-opacity=".45" stroke-width="2"/>' +
        '</pattern>' +
      '</defs>' +
      '<path d="' + track + '" fill="var(--surface)"/>' +
      '<rect x="0" y="40" width="' + nowX + '" height="40" fill="url(#hatch)" clip-path="url(#trackClip)"/>' +
      '<path d="' + track + '" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>';
    // El cole se dibuja sobre el camino: la niña entra al empezar y sale al terminar
    if(r.school){
      var tx0 = xAt(r.school.from), tx1 = xAt(r.school.to), tw = tx1 - tx0;
      var sk = Math.max(tw, 48) / 64;
      svg += '<g transform="translate(' + ((tx0 + tx1) / 2).toFixed(1) + ' 68) scale(' + sk.toFixed(3) + ')">' + schoolIcon() + '</g>' +
        '<text class="tl-label is-muted" x="' + Math.max(tx0 + tw / 2 - 30, 56).toFixed(1) + '" y="88" text-anchor="start">' + fmtHour(r.school.from) + '–' + fmtHour(r.school.to) + '</text>';
    }
    // Horas alternas abajo y arriba del camino, empezando abajo por la más próxima
    // (así, cerca de la niña, la etiqueta no se cruza con el dibujo).
    var ahead = 0;
    events.forEach(function(e, i){
      var x = xAt(e.t), below = e.t < NOW || ahead++ % 2 === 0;
      svg += explosion(e, i, x) + '<text class="tl-label" x="' + x.toFixed(1) + '" y="' + (below ? 88 : 30) + '" text-anchor="middle">' + fmtHour(e.t) + '</text>';
    });
    if(xAt(events[0].t) - TL_X0 > 40){
      svg += '<text class="tl-label is-muted" x="20" y="88" text-anchor="start">' + fmtHour(r.start) + '</text>';
    }
    svg += '<polygon points="' + (nowX - 4) + ',72 ' + (nowX + 4) + ',72 ' + nowX + ',66" fill="var(--ink)"/>' + nowLabel +
      (inSchool ? '' : '<g transform="translate(' + nowX.toFixed(1) + ' 52) scale(1.5)">' + soldierGirl() + '</g>') + '</svg>';
    host.innerHTML = '<div class="timeline">' + svg + '</div>';
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ host.querySelector('svg').pauseAnimations(); }
  }

  /* ---- Tema «Lista» ---- */

  /* ---- Tema «Post-it 2» (boceto-today.html) ---- */
  var NOTE_SLOTS = [ { x:'2%', y:14, rot:-15 }, { x:'28%', y:108, rot:-6 }, { x:'45%', y:200, rot:9 } ];
  var NOTE_FLOAT = [
    { dur:'5.6s', delay:'-0.8s', sway:'1.4deg' },
    { dur:'6.8s', delay:'-3.1s', sway:'-1.2deg' },
    { dur:'6.1s', delay:'-1.9s', sway:'1.8deg' }
  ];
  var noteOrder = TODAY_LATER.map(function(e){ return e.id; });

  function renderPostit2(host){
    var n = TODAY_NEXT;
    host.innerHTML =
      '<div class="pi-next" role="group" aria-label="' + t('aria.next') + '">' +
        '<span class="pi-next-time">' + fmtHour(n.t) + '</span>' +
        '<span class="pi-next-title">' + n.title + '</span>' +
        '<span class="pi-next-side"><span class="pi-next-when">' + t('today.in', { t: untilText(n.t) }) + '</span>' +
        '<span class="pi-next-leave">' + CAR_SVG + ' ' + t('today.leaveAt', { t: n.leave }) + '</span></span></div>' +
      '<div class="board" aria-label="' + t('aria.later') + '"></div>';
    var board = host.querySelector('.board'), els = {};
    TODAY_LATER.forEach(function(item, i){
      var f = NOTE_FLOAT[i % NOTE_FLOAT.length];
      var note = document.createElement('div');
      note.className = 'note';
      note.tabIndex = 0;
      note.setAttribute('role', 'button');
      note.setAttribute('aria-label', fmtHour(item.t) + ' ' + item.title + '. ' + t('aria.front'));
      note.setAttribute('style', catVars(item.cat) + ';--dur:' + f.dur + ';--delay:' + f.delay + ';--sway:' + f.sway + ';--in-delay:' + (0.15 + i * 0.18) + 's');
      var travel = '';
      if(item.travel){
        travel = '<div class="n-travel" role="group" aria-label="' + t('aria.travelMode') + '">' +
          ['walk','car'].map(function(m){
            return '<button type="button" class="n-pill' + (item.travel.mode === m ? ' is-on' : '') + '" data-mode="' + m + '">' + t('short.' + m, { m: item.travel[m].min }) + '</button>';
          }).join('') + '</div>' +
          '<div class="n-leave">' + CLOCK_SVG + t('today.leaveAtLong', { t: '<span class="n-leave-time">' + travelOf(item).leave + '</span>' }) + '</div>';
      }
      note.innerHTML = '<div class="note-shadow"></div><div class="note-card">' +
        '<div class="n-head"><span class="n-time">' + fmtHour(item.t) + '</span><span class="n-cat">' + catName(item.cat) + '</span></div>' +
        '<div class="n-title">' + item.title + '</div>' +
        '<div class="n-meta">' + item.place + ' · ' + item.dist + '</div>' + travel + '</div>';
      note.querySelectorAll('.n-pill').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          item.travel.mode = btn.dataset.mode;
          note.querySelectorAll('.n-pill').forEach(function(b){ b.classList.toggle('is-on', b === btn); });
          note.querySelector('.n-leave-time').textContent = travelOf(item).leave;
        });
      });
      function front(){
        var k = noteOrder.indexOf(item.id);
        if(k > 0){ noteOrder.splice(k, 1); noteOrder.unshift(item.id); placeNotes(els); }
      }
      note.addEventListener('click', front);
      note.addEventListener('keydown', function(e){
        if(e.target === note && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); front(); }
      });
      els[item.id] = note;
      board.appendChild(note);
    });
    placeNotes(els);
  }

  function placeNotes(els){
    noteOrder.forEach(function(id, slot){
      var sl = NOTE_SLOTS[slot] || NOTE_SLOTS[NOTE_SLOTS.length - 1], el = els[id];
      el.style.setProperty('--x', sl.x);
      el.style.setProperty('--y', sl.y + 'px');
      el.style.setProperty('--rot', sl.rot + 'deg');
      el.style.setProperty('--z', String(10 - slot));
    });
    // El tablero crece si algún post-it tiene más texto (pantallas estrechas)
    var board = els[noteOrder[0]].parentNode, h = 0;
    noteOrder.forEach(function(id, slot){
      var sl = NOTE_SLOTS[slot] || NOTE_SLOTS[NOTE_SLOTS.length - 1];
      h = Math.max(h, sl.y + els[id].offsetHeight);
    });
    board.style.height = (h + 40) + 'px';
  }

  var toastTimer;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  /* ---- Categorías y prioridades (editable) ---- */
  var CAT_PALETTE = ['#4fc3f7','#b39ddb','#4cd6a0','#b7bfcb','#8c9eff','#4dd0e1'];

  function cycleColor(btn){
    var current = getComputedStyle(btn).backgroundColor;
    var idx = 0;
    for(var i=0;i<CAT_PALETTE.length;i++){
      if(hexToRgb(CAT_PALETTE[i]) === current){ idx = i; break; }
    }
    var next = CAT_PALETTE[(idx+1) % CAT_PALETTE.length];
    if(!btn.closest('.cat-row').classList.contains('is-editing')){ return; }
    btn.style.background = next;
    var select = btn.closest('.cat-row').querySelector('.priority-select');
    if(select){ select.style.background = next; }
    renderExportCats();
  }

  function hexToRgb(hex){
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgb(' + r + ', ' + g + ', ' + b + ')';
  }

  function onPriorityChange(select){
    var name = rowName(select.closest('.cat-row'));
    toast(t('toast.prio', { name: name, p: select.options[select.selectedIndex].text }));
  }

  function removeCategory(btn){
    var row = btn.closest('.cat-row');
    var name = rowName(row);
    row.remove();
    renderExportCats();
    toast(t('toast.catDeleted', { name: name }));
  }

  function addCategory(){
    var list = document.getElementById('category-list');
    var color = CAT_PALETTE[list.children.length % CAT_PALETTE.length];
    var row = document.createElement('div');
    row.className = 'row cat-row';
    row.innerHTML =
      '<button class="row-bar swatch" style="background:' + color + '" onclick="cycleColor(this)" aria-label="' + t('aria.catColor') + '" title="' + t('aria.catColor') + '"></button>' +
      '<div class="row-body"><input class="cat-name-input" value="' + t('cat.new') + '" readonly aria-label="' + t('aria.catName') + '" onkeydown="if(event.key===\'Enter\'){ editCategory(this); }"></div>' +
      '<button class="row-edit" onclick="editCategory(this)" aria-label="' + t('aria.catEdit') + '" title="' + t('aria.catEdit') + '"></button>' +
      '<button class="row-delete" onclick="removeCategory(this)" aria-label="' + t('aria.catDelete') + '" title="' + t('aria.catDelete') + '">×</button>' +
      '<select class="priority-select" style="background:' + color + '" onchange="onPriorityChange(this)" aria-label="' + t('aria.catPrio') + '">' +
        '<option value="Alta">' + t('prio.Alta') + '</option><option value="Media" selected>' + t('prio.Media') + '</option><option value="Baja">' + t('prio.Baja') + '</option>' +
      '</select>';
    row.querySelector('.row-edit').innerHTML = PENCIL_SVG;
    list.appendChild(row);
    renderExportCats();
    editCategory(row.querySelector('.row-edit'));   // la nueva categoría empieza en modo edición
  }

  // Lápiz: activa la edición del nombre y del color; el mismo botón (✓) o Intro la terminan
  var PENCIL_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
  var CHECK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  function editCategory(el){
    var row = el.closest('.cat-row'), input = row.querySelector('.cat-name-input'), btn = row.querySelector('.row-edit');
    var editing = !row.classList.contains('is-editing');
    // Solo una categoría en edición a la vez
    if(editing){ document.querySelectorAll('.cat-row.is-editing').forEach(function(r){ editCategory(r.querySelector('.row-edit')); }); }
    row.classList.toggle('is-editing', editing);
    input.readOnly = !editing;
    btn.innerHTML = editing ? CHECK_SVG : PENCIL_SVG;
    btn.setAttribute('aria-label', t(editing ? 'aria.catDone' : 'aria.catEdit'));
    btn.setAttribute('title', t(editing ? 'aria.catDone' : 'aria.catEdit'));
    if(editing){ input.focus(); input.select(); }
    else { if(!input.value.trim()){ input.value = t('cat.new'); } renderExportCats(); }
  }

  /* ---- Franja horaria y horario escolar ---- */
  var SCHOOL = {
    week: {entry:'09:00', exit:'17:00'},            // lunes a viernes
    sat:  {on:false, entry:'09:00', exit:'13:00'}   // clases el sábado (opcional)
  };
  var DEFAULT_BOUNDS = {'day-start':'07:30', 'day-end':'23:00'};
  var TIME_RE = /^\d{2}:\d{2}$/;

  function toHours(t){ var p = t.split(':'); return +p[0] + (+p[1]) / 60; }
  function dayBounds(){
    return { start: document.getElementById('day-start').value || DEFAULT_BOUNDS['day-start'],
             end:   document.getElementById('day-end').value   || DEFAULT_BOUNDS['day-end'] };
  }

  // Horario del cole para un día de la semana (lunes = 0). Domingos y
  // festivos/no lectivos del calendario escolar: sin cole.
  function schoolFor(day){
    if(day < 5){ return {on:true, entry:SCHOOL.week.entry, exit:SCHOOL.week.exit}; }
    if(day === 5){ return SCHOOL.sat; }
    return {on:false};
  }

  // Franja horaria menos el horario escolar
  function coveredRanges(d){
    var b = dayBounds();
    if(!d.on){ return [[b.start, b.end]]; }
    var r = [];
    if(b.start < d.entry){ r.push([b.start, d.entry < b.end ? d.entry : b.end]); }
    if(d.exit < b.end){ r.push([d.exit > b.start ? d.exit : b.start, b.end]); }
    return r;
  }

  function rangesText(d){
    var r = coveredRanges(d);
    return r.length ? r.map(function(x){ return '<span style="white-space:nowrap">' + x[0] + '–' + x[1] + '</span>'; }).join(t('and')) : t('cover.none');
  }

  function renderCover(){
    var rows = [[t('monFri'), schoolFor(0)]];
    if(SCHOOL.sat.on){ rows.push([t('saturday'), SCHOOL.sat]); }
    rows.push([SCHOOL.sat.on ? t('cover.sunHol') : t('cover.weekendHol'), {on:false}]);
    var list = document.getElementById('cover-list');
    list.innerHTML = '';
    rows.forEach(function(r){
      var line = document.createElement('div');
      line.className = 'config-line';
      line.innerHTML = '<span class="config-label">' + r[0] + '</span><span class="config-value">' + rangesText(r[1]) + '</span>';
      list.appendChild(line);
    });
  }

  function onSchoolTime(which, field, input){
    var d = SCHOOL[which], v = input.value;
    var entry = field === 'entry' ? v : d.entry, exit = field === 'exit' ? v : d.exit;
    if(!TIME_RE.test(v) || entry >= exit){
      input.value = d[field];
      toast(t('toast.exitAfter'));
      return;
    }
    d[field] = v;
    onScheduleChanged();
  }

  function toggleSaturday(btn){
    SCHOOL.sat.on = !SCHOOL.sat.on;
    btn.setAttribute('aria-checked', String(SCHOOL.sat.on));
    document.getElementById('sat-times').hidden = !SCHOOL.sat.on;
    onScheduleChanged();
  }

  function onBoundsChange(input){
    var b = dayBounds();
    if(!TIME_RE.test(input.value) || b.start >= b.end){
      input.value = DEFAULT_BOUNDS[input.id];
      toast(t('toast.windowOrder'));
    }
    onScheduleChanged();
  }

  function scheduleSummary(){
    var txt = t('sum.week', { t: SCHOOL.week.entry + '–' + SCHOOL.week.exit });
    if(SCHOOL.sat.on){ txt += ' · ' + t('sum.sat', { t: SCHOOL.sat.entry + '–' + SCHOOL.sat.exit }); }
    return txt;
  }

  function onScheduleChanged(){
    var summary = scheduleSummary();
    document.querySelectorAll('.school-note').forEach(function(el){ el.innerHTML = t('note.school', { summary: summary }); });
    renderCover();
    var b = dayBounds();
    CAL_START = Math.floor(toHours(b.start));
    CAL_END = Math.ceil(toHours(b.end));
    renderCalendar(calView);
    fitCalendar();
    updateConfigSummaries();
    if(typeof renderToday === 'function' && document.getElementById('layout-hint').textContent){ renderToday(); }
  }

  /* ---- Exportación a Google Calendar ---- */
  function toggleSwitch(btn, label){
    var on = btn.getAttribute('aria-checked') !== 'true';
    btn.setAttribute('aria-checked', String(on));
    toast(t(on ? 'toast.on' : 'toast.off', { label: label }));
  }

  function toggleExport(btn){
    var on = btn.getAttribute('aria-checked') !== 'true';
    btn.setAttribute('aria-checked', String(on));
    document.getElementById('export-options').hidden = !on;
    updateConfigSummaries();
    if(on){ renderExportCats(); }
  }

  // Una casilla por categoría definida arriba (se mantiene al renombrar o añadir)
  function renderExportCats(){
    var box = document.getElementById('export-cats');
    var prev = [];
    box.querySelectorAll('input').forEach(function(i){ prev.push(i.checked); });
    box.innerHTML = '';
    document.querySelectorAll('#category-list .cat-row').forEach(function(row, idx){
      var label = document.createElement('label');
      label.className = 'check-row';
      var input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = idx < prev.length ? prev[idx] : true;
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = row.querySelector('.row-bar').style.background;
      var name = document.createElement('span');
      name.textContent = rowName(row);
      label.appendChild(input); label.appendChild(dot); label.appendChild(name);
      box.appendChild(label);
    });
    document.querySelectorAll('[data-cat-name]').forEach(function(el){ el.textContent = catName(el.dataset.catName) + (el.dataset.suffix ? ' ' + t(el.dataset.suffix) : ''); });
    updateConfigSummaries();
  }
  document.getElementById('category-list').addEventListener('input', renderExportCats);

  // Acordeón: abrir un bloque de Configuración cierra el que estuviera abierto
  document.querySelectorAll('.cfg-group').forEach(function(g){
    g.addEventListener('toggle', function(){
      if(!g.open){ return; }
      document.querySelectorAll('.cfg-group[open]').forEach(function(o){ if(o !== g){ o.open = false; } });
    });
  });

  // Resumen del valor actual en la cabecera de cada bloque plegado
  function updateConfigSummaries(){
    function put(id, text){ var el = document.getElementById('sum-' + id); if(el){ el.textContent = text; } }
    put('language', LANGS[LANG]);
    put('look', [t(APPEARANCE.layout === 'list' ? 'layout.list' : (APPEARANCE.layout === 'postit1' ? 'Post-it 1' : 'Post-it 2')),
                 t('mode.' + APPEARANCE.mode), t('bar.' + APPEARANCE.bar)].join(' · '));
    var b = dayBounds();
    put('hours', b.start + '–' + b.end + ' · ' + t('sum.school') + '\u00a0' + SCHOOL.week.entry + '\u2011' + SCHOOL.week.exit);
    put('links', t('sum.links', { n: 0 }));
    put('cats', t('sum.cats', { n: document.querySelectorAll('#category-list .cat-row').length }));
    put('gcal', t(document.getElementById('export-switch').getAttribute('aria-checked') === 'true' ? 'sum.gcalOn' : 'sum.gcalOff'));
  }


  /* ---- Calendario (vista día / semana) ---- */
  // Alto de la cuadrícula: en el móvil, el que quede libre en la pantalla (ver fitCalendar);
  // en la maqueta de escritorio, fijo. El horario escolar se comprime en CAL_SCHOOL_PX y el
  // resto del alto se reparte entre las horas fuera del cole.
  var CAL_START = 7, CAL_END = 23, CAL_BODY_PX = 440, CAL_BODY_DEFAULT = 440, CAL_BODY_MIN = 250, CAL_SCHOOL_PX = 44;   // sigue la franja horaria de Config
  // Semana del 7 al 13 de septiembre de 2026; los nombres salen del idioma elegido
  var WEEK_DAYS = [0,1,2,3,4,5,6].map(function(i){ return { d:new Date(2026, 8, 7 + i), isToday: i === 4 }; });
  function calRangeText(view){
    return view === 'week'
      ? '7–13 ' + fmtDate(WEEK_DAYS[0].d, { month:'long' })
      : cap(fmtDate(TODAY_DATE, { weekday:'short', day:'numeric', month:'short' }));
  }
  var CAL_EVENTS = [
    {day:0, title:'Natación', start:18, end:19, cat:'actividad'},
    {day:1, title:'Inglés', start:17, end:18, cat:'actividad'},
    {day:3, title:'Piano', start:17.5, end:18.25, cat:'actividad'},
    {day:4, title:'Natación', start:18, end:19, cat:'actividad'},
    {day:4, title:'Merienda con Clara', start:19.5, end:20.5, cat:'libre'},
    {day:5, title:'Cumpleaños de Sofía', start:17, end:19, cat:'libre'}
  ];
  var CAL_DEADLINES = [
    {day:4, title:'Entrega Lengua', time:22, cat:'tarea'}
  ];
  var calView = 'week';

  // Escala vertical (en px) de la franja horaria con el tramo escolar comprimido.
  // En la semana se comprime el horario de lunes a viernes; en la vista día, el de ese día.
  function calScale(sd){
    var start = CAL_START, end = CAL_END, school = null;
    var segs = [{ from:start, to:end }];
    if(sd.on){
      var a = Math.max(toHours(sd.entry), start), z = Math.min(toHours(sd.exit), end);
      if(a < z){
        school = { from:a, to:z };
        segs = [{ from:start, to:a }, { from:a, to:z, school:true }, { from:z, to:end }]
          .filter(function(g){ return g.to > g.from; });
      }
    }
    var outside = segs.reduce(function(sum, g){ return sum + (g.school ? 0 : g.to - g.from); }, 0);
    var free = CAL_BODY_PX - (school && outside ? CAL_SCHOOL_PX : 0), y = 0;
    segs.forEach(function(g){
      g.h = g.school ? (outside ? CAL_SCHOOL_PX : CAL_BODY_PX) : free * (g.to - g.from) / outside;
      g.y = y; y += g.h;
    });
    function pos(t){
      if(t <= start){ return 0; }
      if(t >= end){ return CAL_BODY_PX; }
      for(var i = 0; i < segs.length; i++){
        var g = segs[i];
        if(t <= g.to){ return g.y + g.h * (t - g.from) / (g.to - g.from); }
      }
      return CAL_BODY_PX;
    }
    if(school){ school.y0 = pos(school.from); school.y1 = pos(school.to); }
    return { school:school, pos:pos, inSchool:function(t){ return school && t > school.from && t < school.to; } };
  }

  function fmtHour(h){
    var hh = Math.floor(h), mm = Math.round((h - hh) * 60);
    return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }

  function renderCalendar(view){
    var grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    var isWeek = view === 'week';
    var days = isWeek ? WEEK_DAYS : [WEEK_DAYS[TODAY_DAY]];
    var sc = calScale(schoolFor(isWeek ? 0 : TODAY_DAY)), pos = sc.pos;

    grid.style.gridTemplateColumns = '34px repeat(' + days.length + ', minmax(0, 1fr))';
    grid.style.columnGap = isWeek ? '2px' : '0';

    // En la vista día la fecha ya está en la cabecera: sin fila de nombres de día
    if(isWeek){ grid.appendChild(document.createElement('div')); }

    if(isWeek) days.forEach(function(d){
      var h = document.createElement('div');
      h.className = 'cal-daylabel' + (d.isToday ? ' is-today' : '');
      h.innerHTML = '<span class="dl-name">' + cap(fmtDate(d.d, { weekday:'narrow' })) + '</span><span class="dl-date">' + d.d.getDate() + '</span>';
      grid.appendChild(h);
    });

    // Horas: cada hora fuera del cole tiene línea; etiqueta cada dos horas y en los bordes del cole
    // (en pantallas altas, con sitio de sobra, etiqueta cada hora)
    var lines = [], labels = [], step = pos(CAL_END) - pos(CAL_END - 1) >= 48 ? 1 : 2;
    for(var hr = CAL_START; hr <= CAL_END; hr++){
      if(sc.inSchool(hr)){ continue; }
      if(hr > CAL_START && hr < CAL_END){ lines.push(hr); }
      if((hr - CAL_START) % step === 0 || hr === CAL_END){ labels.push(hr); }
    }
    if(sc.school){ labels.push(sc.school.from, sc.school.to); }
    labels.sort(function(x, y){ return x - y; });
    var hourCol = document.createElement('div');
    hourCol.className = 'cal-hourcol';
    hourCol.style.height = CAL_BODY_PX + 'px';
    var lastY = -99;
    labels.forEach(function(hr, i){
      var y = pos(hr), isEdge = sc.school && (hr === sc.school.from || hr === sc.school.to);
      if(y - lastY < 13 && !isEdge){ return; }
      var lab = document.createElement('div');
      lab.className = 'cal-hourlabel' + (hr === CAL_END ? ' is-last' : '');
      lab.style.top = y + 'px';
      lab.textContent = fmtHour(hr);
      hourCol.appendChild(lab);
      lastY = y;
    });
    if(sc.school){
      hourCol.insertAdjacentHTML('beforeend',
        '<svg class="cal-school-icon" viewBox="-33 -53 66 54" role="img" aria-label="' + t('aria.school') + '" style="top:' +
        ((sc.school.y0 + sc.school.y1) / 2) + 'px">' + schoolIcon() + '</svg>');
    }
    grid.appendChild(hourCol);

    days.forEach(function(d, i){
      var realDay = isWeek ? i : TODAY_DAY;
      var col = document.createElement('div');
      col.className = 'cal-daycol' + (d.isToday ? ' is-today' : '');
      col.style.height = CAL_BODY_PX + 'px';

      lines.forEach(function(hr){
        var ln = document.createElement('div');
        ln.className = 'cal-hourline';
        ln.style.top = pos(hr) + 'px';
        col.appendChild(ln);
      });

      var sd = schoolFor(realDay);
      if(sd.on){
        var y0 = pos(Math.max(toHours(sd.entry), CAL_START)), y1 = pos(Math.min(toHours(sd.exit), CAL_END));
        var band = document.createElement('div');
        band.className = 'school-band';
        band.style.top = y0 + 'px';
        band.style.height = Math.max(y1 - y0, 0) + 'px';
        if(!isWeek){ band.innerHTML = '<span>' + t('cfg.school') + ' · ' + sd.entry + '–' + sd.exit + '</span>'; }
        col.appendChild(band);
      }

      CAL_EVENTS.filter(function(e){ return e.day === realDay; }).forEach(function(e){
        var bar = document.createElement('div');
        bar.className = 'cal-bar cat-' + e.cat;
        bar.style.top = pos(e.start) + 'px';
        bar.style.height = (pos(e.end) - pos(e.start)) + 'px';
        bar.title = e.title + ' · ' + fmtHour(e.start) + '–' + fmtHour(e.end);
        bar.innerHTML = '<span class="bar-title">' + e.title + '</span>' +
          (!isWeek ? '<span class="bar-time">' + fmtHour(e.start) + '–' + fmtHour(e.end) + '</span>' : '');
        col.appendChild(bar);
      });

      CAL_DEADLINES.filter(function(e){ return e.day === realDay; }).forEach(function(e){
        var mk = document.createElement('div');
        mk.className = 'cal-deadline';
        mk.style.top = pos(e.time) + 'px';
        mk.title = e.title + ' · ' + fmtHour(e.time);
        mk.innerHTML = '<span class="dl-dot"></span>' + (!isWeek ? '<span class="dl-label">' + e.title + ' · ' + fmtHour(e.time) + '</span>' : '');
        col.appendChild(mk);
      });

      grid.appendChild(col);
    });
  }

  // En el móvil, ajusta el alto de la cuadrícula al hueco libre para que no haga falta
  // scroll (con un mínimo legible: en pantallas muy bajas sí se desplaza).
  var MOBILE = window.matchMedia('(max-width:500px)');
  function fitCalendar(){
    var screen = document.getElementById('screen-calendar');
    if(!screen.classList.contains('active')){ return; }
    var target = CAL_BODY_DEFAULT;
    if(MOBILE.matches){
      var main = screen.parentElement, cs = getComputedStyle(main);
      var free = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - screen.offsetHeight;
      target = Math.max(CAL_BODY_MIN, Math.floor(CAL_BODY_PX + free));
    }
    if(target !== CAL_BODY_PX){ CAL_BODY_PX = target; renderCalendar(calView); }
  }
  window.addEventListener('resize', fitCalendar);

  function setCalView(btn){
    document.querySelectorAll('.seg-btn[data-view]').forEach(function(b){ b.classList.remove('is-active'); });
    btn.classList.add('is-active');
    var view = calView = btn.dataset.view;
    document.getElementById('cal-range').textContent = calRangeText(view);
    renderCalendar(view);
    fitCalendar();
  }

  loadAppearance();
  loadLanguage();
  applyI18n();
</script>
</body>
