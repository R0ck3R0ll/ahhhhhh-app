    <rect x="176" y="68" width="44" height="26" rx="10" fill="#22397A"/>
    <rect x="186" y="88" width="24" height="28" rx="6" fill="#2C4C93"/>
    <rect x="76" y="132" width="34" height="22" rx="8" fill="#22397A" transform="rotate(-40 93 143)"/>
    <circle cx="198" cy="236" r="128" fill="#22397A"/>
    <circle cx="198" cy="236" r="104" fill="#FBF6EC"/>
    <path d="M118 182 A104 104 0 0 1 252 148" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity=".7"/>
