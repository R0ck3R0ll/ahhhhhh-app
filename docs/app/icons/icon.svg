    <rect x="262" y="202" width="28" height="22" rx="5" fill="#F59BB0"/>
    <rect x="394" y="240" width="28" height="30" rx="5" fill="#F5CD4A"/>
    <rect x="306" y="286" width="28" height="26" rx="5" fill="#8EC5B5"/>
    <ellipse cx="364" cy="255" rx="24" ry="19" fill="none" stroke="#E5383B" stroke-width="7"/>
  </g>

  <!-- cronómetro (delante, a la izquierda) -->
