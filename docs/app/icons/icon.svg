  <ellipse cx="410" cy="468" rx="40" ry="10" fill="#B9CDF0"/>
  <path d="M410 466 C384 430 352 400 352 362 a58 58 0 0 1 116 0 c0 38 -32 68 -58 104 z" fill="#E5383B"/>
