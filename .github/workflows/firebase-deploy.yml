# Publica la App en Firebase Hosting (https://ahhhhhh-today.web.app) cada vez que cambia.
# Usa la llave de la cuenta de servicio github-deploy, guardada en el secreto FIREBASE_SERVICE_ACCOUNT.
name: Publicar en Firebase

on:
  push:
    branches:
      - main
      - claude/hopeful-lovelace-18fa2k
    paths:
      - 'docs/app/**'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ahhhhhh-today
          channelId: live
