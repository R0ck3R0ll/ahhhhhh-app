<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · boceto post-its</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#D9D9D9;
    --surface:#FFFFFF;
    --border:#C9C7C2;
    --ink:#2B2925;
    --text:#2B2925;
    --text-muted:#6F6A62;
    --accent:#B34567;
    --accent-strong:#942F4D;
    --accent-soft:#F2DDE3;
    --alert-bg:#4a2f2a;
    --alert-text:#f0c9bd;
    --alert-body-text:#e3b6a8;
    --warn-bg:#e8b839;
    --warn-text:#2b1d02;
    --cat-tarea:#5fb8b0;      --cat-tarea-deep:#0b3431;
    --cat-cita:#a08bd8;       --cat-cita-deep:#271a47;
    --cat-actividad:#8bb06a;  --cat-actividad-deep:#1f3312;
    --cat-libre:#6f95c4;      --cat-libre-deep:#14263d;
    --font-display:'Fraunces', serif;
    --font-body:'IBM Plex Sans', system-ui, sans-serif;
  }

  *{ box-sizing:border-box; }
  html, body{ margin:0; }
  body{
    background:#cfcdc8;
    color:var(--text);
    font-family:var(--font-body);
    display:flex; justify-content:center;
    min-height:100vh;
  }
  .page{ width:100%; display:flex; justify-content:center; padding:28px 16px 40px; }

  .shell{
    width:100%; max-width:390px; height:844px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:36px;
    box-shadow:0 2px 4px rgba(0,0,0,.06), 0 24px 60px rgba(0,0,0,.18);
    overflow:hidden;
    display:flex; flex-direction:column;
  }

  .topbar{ padding:22px 22px 10px; }
  .brand{ font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  .topbar h1{
    font-family:var(--font-display); font-style:italic; font-weight:700;
    font-size:36px; line-height:1; margin:4px 0 0;
  }
  .subtitle{ font-size:13px; color:var(--text-muted); margin-top:6px; }

  main{
    flex:1; min-height:0;
    overflow-y:auto; overflow-x:hidden;
    padding:4px 18px 16px;
    display:flex; flex-direction:column; gap:16px;
  }

  /* ---- Línea de tiempo: el camino ---- */
  .timeline svg{ display:block; width:100%; height:auto; overflow:visible; }
  .tl-label{ font-family:var(--font-body); font-size:10px; font-weight:700; fill:var(--text); font-variant-numeric:tabular-nums; }
  .tl-label.is-muted{ fill:var(--text-muted); font-weight:500; }
  .tl-label.is-now{ fill:var(--accent-strong); }

  .boom{ transform-box:fill-box; transform-origin:center; animation:boomIdle var(--dur,2.6s) ease-in-out infinite; animation-delay:var(--delay,0s); }
  .boom.is-next{ animation:boomBig 2.4s cubic-bezier(.3,1.6,.5,1) infinite; }
  @keyframes boomIdle{ 0%,100%{ transform:scale(1) rotate(0deg); } 50%{ transform:scale(1.08) rotate(5deg); } }
  @keyframes boomBig{
    0%{ transform:scale(.8) rotate(0deg); }
    14%{ transform:scale(1.24) rotate(-8deg); }
    30%{ transform:scale(1) rotate(2deg); }
    100%{ transform:scale(.8) rotate(0deg); }
  }
  .spark{ opacity:0; animation:spark 2.4s ease-out infinite; }
  @keyframes spark{
    0%,10%{ opacity:0; transform:translate(0,0); }
    16%{ opacity:1; }
    55%{ opacity:0; transform:translate(var(--sx),var(--sy)); }
    100%{ opacity:0; transform:translate(var(--sx),var(--sy)); }
  }

  .w-bob{ animation:bob .45s ease-in-out infinite alternate; }
  .ponytail{ transform-box:fill-box; transform-origin:100% 50%; animation:swing-hair .45s ease-in-out infinite alternate; }
  @keyframes bob{ from{ transform:translateY(0); } to{ transform:translateY(-1.4px); } }
  @keyframes swing-hair{ from{ transform:rotate(-14deg); } to{ transform:rotate(16deg); } }

  /* ---- Próximo evento ---- */
  .next{
    position:relative; overflow:hidden; flex:none;
    display:flex; align-items:center; gap:12px;
    background:var(--warn-bg); color:var(--warn-text);
    border:2px solid var(--ink); border-radius:16px;
    box-shadow:0 3px 0 var(--ink);
    padding:11px 16px;
  }
  .next::after{
    content:""; position:absolute; top:0; bottom:0; left:-60%; width:40%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    animation:sheen 6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sheen{ 0%,70%{ left:-60%; } 100%{ left:130%; } }
  .next-time{ font-family:var(--font-display); font-weight:700; font-size:24px; line-height:1; font-variant-numeric:tabular-nums; }
  .next-title{ flex:1; min-width:0; font-family:var(--font-display); font-weight:600; font-size:18px; line-height:1.1; }
  .next-side{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; text-align:right; }
  .next-when{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .next-leave{ display:flex; align-items:center; gap:4px; font-size:12px; font-weight:600; }

  /* ---- Post-its flotantes ---- */
  .board{ position:relative; flex:none; height:384px; }
  .note{
    position:absolute;
    width:min(56%, 188px); height:150px;
    left:var(--x); top:var(--y); z-index:var(--z);
    transform:rotate(var(--rot));
    transition:
      left .8s cubic-bezier(.34,1.25,.5,1),
      top .8s cubic-bezier(.34,1.25,.5,1),
      transform .8s cubic-bezier(.34,1.25,.5,1);
    animation:noteIn .9s cubic-bezier(.2,.9,.3,1.15) backwards;
    animation-delay:var(--in-delay, 0s);
    cursor:pointer;
    outline:none;
  }
  @keyframes noteIn{
    from{ opacity:0; transform:translateY(-40px) rotate(calc(var(--rot) - 14deg)) scale(.9); }
    to{ opacity:1; transform:translateY(0) rotate(var(--rot)) scale(1); }
  }
  .note-shadow{
    position:absolute; left:14%; right:14%; bottom:-22px; height:18px;
    border-radius:50%;
    background:radial-gradient(closest-side, rgba(20,18,15,.34), rgba(20,18,15,0));
    animation:shadowFloat var(--dur) ease-in-out infinite;
    animation-delay:var(--delay);
  }
  .note-card{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:13px 15px;
    border-radius:22px;
    border:1.5px solid rgba(43,41,37,.8);
    background:
      linear-gradient(160deg, rgba(255,255,255,.32), rgba(255,255,255,0) 48%),
      var(--c);
    color:var(--deep);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 10px 20px rgba(0,0,0,.10);
    animation:float var(--dur) ease-in-out infinite;
    animation-delay:var(--delay);
  }
  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-10px) rotate(var(--sway)); }
  }
  @keyframes shadowFloat{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(.76); opacity:.5; }
  }
  .note:focus-visible .note-card{ outline:3px solid var(--accent); outline-offset:3px; }

  .n-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .n-cat{ font-size:9px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; opacity:.75; }
  .n-time{ font-family:var(--font-display); font-weight:700; font-size:26px; line-height:1; font-variant-numeric:tabular-nums; }
  .n-title{ font-family:var(--font-display); font-weight:600; font-size:15.5px; line-height:1.15; margin-top:3px; }
  .n-meta{ font-size:11px; font-weight:500; opacity:.82; margin-top:3px; }
  .n-travel{ display:flex; gap:5px; margin-top:8px; }
  .n-pill{
    font-family:var(--font-body); font-size:10.5px; font-weight:600;
    padding:4px 8px; border-radius:999px; cursor:pointer; white-space:nowrap;
    border:1px solid rgba(43,41,37,.35);
    background:rgba(255,255,255,.45); color:var(--deep);
  }
  .n-pill.is-on{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .n-pill:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .n-leave{ display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; margin-top:5px; }

  /* ---- Aviso de carga de trabajo ---- */
  .alert{
    margin-top:auto; flex:none;
    display:flex; align-items:center; gap:12px;
    background:var(--alert-bg); color:var(--alert-text);
    border:2px solid var(--ink); border-radius:16px;
    box-shadow:0 3px 0 var(--ink);
    padding:11px 14px;
  }
  .alert svg{ flex:none; animation:flip 4.5s ease-in-out infinite; }
  @keyframes flip{ 0%,78%{ transform:rotate(0deg); } 94%,100%{ transform:rotate(180deg); } }
  .alert-title{ font-weight:700; font-size:13.5px; }
  .alert-body{ font-size:12px; color:var(--alert-body-text); margin-top:1px; }

  /* ---- Tab bar ---- */
  .tabbar{
    display:grid; grid-template-columns:repeat(5,1fr);
    border-top:1px solid var(--border);
    background:var(--surface);
    padding:8px 6px calc(10px + env(safe-area-inset-bottom));
  }
  .tab{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--text-muted);
    font-family:var(--font-body); font-size:10px; font-weight:600;
    padding:6px 1px; border-radius:10px;
  }
  .tab.is-active{ color:var(--accent); }

  @media (prefers-reduced-motion: reduce){
    .boom, .spark, .w-bob, .ponytail, .next::after,
    .note, .note-card, .note-shadow, .alert svg{ animation:none !important; }
    .note{ transition-duration:.01s; }
  }
</style>
</head>
<body>
<div class="page">
<div class="shell">

  <header class="topbar">
    <div class="brand">AHHHHHH!!!!!</div>
    <h1>Today</h1>
    <div class="subtitle">Viernes, 11 de septiembre · plan de Martina</div>
  </header>

  <main>
    <div class="timeline" id="timeline" aria-label="Línea de tiempo de la tarde"></div>

    <div class="next" role="group" aria-label="Próximo evento">
      <span class="next-time">18:00</span>
      <span class="next-title">Natación</span>
      <span class="next-side">
        <span class="next-when">en 45 min</span>
        <span class="next-leave">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14l-1.5-5.5A2 2 0 0 0 15.6 10H8.4a2 2 0 0 0-1.9 1.5Z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>
          sal 17:35
        </span>
      </span>
    </div>

    <div class="board" id="board" aria-label="Eventos siguientes"></div>

    <div class="alert" role="status">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12"/><path d="M6 22h12"/><path d="M7 2v4a5 5 0 0 0 5 5 5 5 0 0 0 5-5V2"/><path d="M7 22v-4a5 5 0 0 1 5-5 5 5 0 0 1 5 5v4"/></svg>
      <div>
        <div class="alert-title">Ciencias Naturales en 3 días</div>
        <div class="alert-body">Trabajo · estimado 2 h · entrega el lunes 14/09</div>

  <nav class="tabbar" aria-label="Navegación principal">
    <button class="tab is-active" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Today
    </button>
    <button class="tab" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4l3 3-8 8-4 1 1-4 8-8z"/><path d="M4 20h16"/></svg>
      Actividades
    </button>
    <button class="tab" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
      Eventos
    </button>
    <button class="tab" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/></svg>
      Calendario
    </button>
    <button class="tab" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg>
      Config
    </button>
  </nav>

</div>
</div>

<script>
  var NOW = 17.25, START = 16, END = 22, X0 = 20, X1 = 304, TRACK_Y = 58;

  var TIMELINE = [
    { t:18,    label:'18:00', cat:'actividad', next:true },
    { t:19.5,  label:'19:30', cat:'libre' },
    { t:20.5,  label:'20:30', cat:'cita' },
    { t:22,    label:'22:00', cat:'tarea' }
  ];

  var LATER = [
    { id:'clara', label:'19:30', cat:'libre', catName:'Tiempo libre',
      title:'Merienda con Clara', meta:'Casa de Clara · 600 m',
      travel:{ mode:'walk',
        walk:{ label:'A pie 10′', leave:'19:20' },
        car:{  label:'Coche 5′',  leave:'19:25' } } },
    { id:'abuela', label:'20:30', cat:'cita', catName:'Cita',
      title:'Videollamada con la abuela', meta:'En casa · 20 min' },
    { id:'lengua', label:'22:00', cat:'tarea', catName:'Tarea',
      title:'Entrega de Lengua', meta:'Classroom · redacción' }
  ];

  // Posición de cada hueco de la pila: el de delante, más volcado.
  var SLOTS = [
    { x:'2%',  y:14,  rot:-15 },
    { x:'28%', y:108, rot:-6  },
    { x:'45%', y:200, rot:9   }
  ];
  var FLOAT = [
    { dur:'5.6s', delay:'-0.8s', sway:'1.4deg'  },
    { dur:'6.8s', delay:'-3.1s', sway:'-1.2deg' },
    { dur:'6.1s', delay:'-1.9s', sway:'1.8deg'  }
  ];

  function xAt(t){ return X0 + (t - START) / (END - START) * (X1 - X0); }

  function seeded(seed){
    var v = seed;
    return function(){ v = (v * 9301 + 49297) % 233280; return v / 233280; };
  }

  function boomPoints(seed, rOut, rIn, spikes){
    var rnd = seeded(seed), pts = [];
    for(var k = 0; k < spikes * 2; k++){
      var a = (k + (rnd() - .5) * .5) * Math.PI / spikes - Math.PI / 2;
      var r = k % 2 ? rIn * (.85 + rnd() * .3) : rOut * (.72 + rnd() * .5);
      pts.push((Math.cos(a) * r).toFixed(2) + ',' + (Math.sin(a) * r).toFixed(2));
    }
    return pts.join(' ');
  }

  function explosion(e, i){
    var big = !!e.next, color = 'var(--cat-' + e.cat + ')', sparks = '';
    if(big){
      for(var k = 0; k < 6; k++){
        var a = k / 6 * Math.PI * 2 + .3;
        sparks += '<g class="spark" style="--sx:' + (Math.cos(a) * 17).toFixed(1) + 'px;--sy:' + (Math.sin(a) * 17).toFixed(1) + 'px">' +
          '<circle r="' + (k % 2 ? 1.1 : 1.6) + '" fill="' + (k % 2 ? '#ffe066' : color) + '" stroke="var(--ink)" stroke-width=".6"/></g>';
      }
    }
    return '<g transform="translate(' + xAt(e.t).toFixed(1) + ' ' + TRACK_Y + ')">' + sparks +
      '<g class="boom' + (big ? ' is-next' : '') + '" style="--dur:' + (2.6 + i * .45) + 's;--delay:' + (-i * .7) + 's">' +
        '<polygon points="' + boomPoints(7 + i * 13, big ? 18 : 14.5, 7.5, 11) + '" fill="' + color + '" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/>' +
        '<polygon points="' + boomPoints(3 + i * 29, big ? 9.5 : 7.5, 4.4, 9) + '" fill="' + (big ? '#ffe066' : '#fff4c2') + '" stroke="var(--ink)" stroke-width=".9" stroke-linejoin="round"/>' +
      '</g></g>';
  }

  // Extremidad articulada en (x, y) que oscila entre `from` y `to` grados.
  function limb(x, y, len, w, color, from, to, tip){
    return '<g transform="translate(' + x + ' ' + y + ')"><g>' +
      '<animateTransform attributeName="transform" type="rotate" values="' + from + ';' + to + ';' + from + '" dur="0.9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>' +
      '<line x1="0" y1="0" x2="0" y2="' + len + '" stroke="var(--ink)" stroke-width="' + (w + 1.8) + '" stroke-linecap="round"/>' +
      '<line x1="0" y1="0" x2="0" y2="' + len + '" stroke="' + color + '" stroke-width="' + w + '" stroke-linecap="round"/>' +
      tip + '</g></g>';
  }

  function soldierGirl(){
    var OLIVE = '#6f7d3c', OLIVE_DARK = '#56622d', KHAKI = '#7d8a45', SKIN = '#f2c7a0', HAIR = '#6b3b1f';
    var boot = '<path d="M-2 9.3 h4.6 a1.7 1.7 0 0 1 0 3.4 h-4.6 z" fill="var(--ink)"/>';
    var hand = '<circle cx="0" cy="8.1" r="1.5" fill="' + SKIN + '" stroke="var(--ink)" stroke-width=".8"/>';
    return '<g class="w-bob">' +
      limb(-0.8, -12, 10.5, 3.2, OLIVE_DARK, 24, -24, boot) +
      limb(0, -21.5, 7.5, 2.6, OLIVE_DARK, -30, 30, hand) +
      '<rect x="-8.6" y="-24" width="6" height="10.5" rx="2" fill="' + OLIVE_DARK + '" stroke="var(--ink)" stroke-width="1.2"/>' +
      '<rect x="-3.4" y="-24.5" width="7.2" height="13" rx="2.8" fill="' + KHAKI + '" stroke="var(--ink)" stroke-width="1.3"/>' +
      '<rect x="-3.4" y="-14.6" width="7.2" height="2" fill="var(--ink)"/>' +
      '<rect x="0.2" y="-14.4" width="1.6" height="1.6" fill="#e8b839"/>' +
      '<ellipse class="ponytail" cx="-5.6" cy="-28.4" rx="3" ry="1.7" fill="' + HAIR + '" stroke="var(--ink)" stroke-width="1"/>' +
      '<circle cx="1" cy="-29.5" r="4.6" fill="' + SKIN + '" stroke="var(--ink)" stroke-width="1.3"/>' +
      '<ellipse cx="3.1" cy="-29.6" rx=".75" ry="1" fill="var(--ink)"/>' +
      '<circle cx="3.4" cy="-27.6" r="1" fill="#ea8f8f" opacity=".8"/>' +
      '<path d="M2.2 -26.3 q1 .8 2.1 0" fill="none" stroke="var(--ink)" stroke-width=".8" stroke-linecap="round"/>' +
      '<path d="M-3.6 -29.8 q.6 4.6 4.4 5.2" fill="none" stroke="var(--ink)" stroke-width=".8"/>' +
      '<path d="M-4.9 -30.6 C-4.9 -37.6 7.1 -37.6 7.1 -30.6 Z" fill="' + OLIVE + '" stroke="var(--ink)" stroke-width="1.3" stroke-linejoin="round"/>' +
      '<circle cx="3.8" cy="-33.1" r="1" fill="' + OLIVE_DARK + '"/>' +
      '<circle cx="-1.4" cy="-32.5" r=".8" fill="' + OLIVE_DARK + '"/>' +
      '<path d="M-2.2 -34.1 q2.4 -1.8 5 -.8" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".9" stroke-linecap="round"/>' +
      '<rect x="-6.2" y="-31.4" width="14.6" height="2" rx="1" fill="' + OLIVE_DARK + '" stroke="var(--ink)" stroke-width="1.1"/>' +
      limb(0.8, -12, 10.5, 3.2, OLIVE, -24, 24, boot) +
      limb(0.6, -21.5, 7.5, 2.6, KHAKI, 30, -30, hand) +
    '</g>';
  }

  function renderTimeline(){
    var nowX = xAt(NOW);
    var track = 'M20 52 H316 V44 L338 58 L316 72 V64 H20 A6 6 0 0 1 20 52 Z';
    var svg =
      '<svg viewBox="0 -10 350 104" role="img" aria-label="Ahora 17:15; próximos: 18:00, 19:30, 20:30 y 22:00">' +
      '<defs>' +
        '<clipPath id="trackClip"><path d="' + track + '"/></clipPath>' +
        '<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
          '<rect width="6" height="6" fill="var(--accent-soft)"/>' +
          '<line x1="0" y1="0" x2="0" y2="6" stroke="var(--accent)" stroke-opacity=".45" stroke-width="2"/>' +
        '</pattern>' +
      '</defs>' +
      '<path d="' + track + '" fill="var(--surface)"/>' +
      '<rect x="0" y="40" width="' + nowX + '" height="40" fill="url(#hatch)" clip-path="url(#trackClip)"/>' +
      '<path d="' + track + '" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>';

    TIMELINE.forEach(function(e, i){
      svg += explosion(e, i) +
        '<text class="tl-label" x="' + xAt(e.t).toFixed(1) + '" y="88" text-anchor="middle">' + e.label + '</text>';
    });

    svg +=
      '<text class="tl-label is-muted" x="20" y="88" text-anchor="start">16:00</text>' +
      '<polygon points="' + (nowX - 4) + ',72 ' + (nowX + 4) + ',72 ' + nowX + ',66" fill="var(--ink)"/>' +
      '<text class="tl-label is-now" x="' + (nowX - 18).toFixed(1) + '" y="42" text-anchor="end">17:15</text>' +
      '<g transform="translate(' + nowX.toFixed(1) + ' 52) scale(1.5)">' + soldierGirl() + '</g>' +
      '</svg>';

    var host = document.getElementById('timeline');
    host.innerHTML = svg;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      host.querySelector('svg').pauseAnimations();
    }
  }

  var order = LATER.map(function(e){ return e.id; });
  var noteEls = {};

  function travelHtml(item){
    var t = item.travel;
    return '<div class="n-travel" role="group" aria-label="Modo de traslado">' +
        '<button type="button" class="n-pill' + (t.mode === 'walk' ? ' is-on' : '') + '" data-mode="walk">' + t.walk.label + '</button>' +
        '<button type="button" class="n-pill' + (t.mode === 'car' ? ' is-on' : '') + '" data-mode="car">' + t.car.label + '</button>' +
      '</div>' +
      '<div class="n-leave">' +
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' +
        'Sal a las <span class="n-leave-time">' + t[t.mode].leave + '</span>' +
      '</div>';
  }

  function buildNotes(){
    var board = document.getElementById('board');
    LATER.forEach(function(item, i){
      var f = FLOAT[i % FLOAT.length];
      var note = document.createElement('div');
      note.className = 'note';
      note.tabIndex = 0;
      note.setAttribute('role', 'button');
      note.setAttribute('aria-label', item.label + ' ' + item.title + '. Traer al frente');
      note.style.setProperty('--c', 'var(--cat-' + item.cat + ')');
      note.style.setProperty('--deep', 'var(--cat-' + item.cat + '-deep)');
      note.style.setProperty('--dur', f.dur);
      note.style.setProperty('--delay', f.delay);
      note.style.setProperty('--sway', f.sway);
      note.style.setProperty('--in-delay', (0.15 + i * 0.18) + 's');
      note.innerHTML =
        '<div class="note-shadow"></div>' +
        '<div class="note-card">' +
          '<div class="n-head"><span class="n-time">' + item.label + '</span><span class="n-cat">' + item.catName + '</span></div>' +
          '<div class="n-title">' + item.title + '</div>' +
          '<div class="n-meta">' + item.meta + '</div>' +
          (item.travel ? travelHtml(item) : '') +
        '</div>';

      if(item.travel){
        note.querySelectorAll('.n-pill').forEach(function(btn){
          btn.addEventListener('click', function(e){
            e.stopPropagation();
            item.travel.mode = btn.dataset.mode;
            note.querySelectorAll('.n-pill').forEach(function(b){
              b.classList.toggle('is-on', b === btn);
            });
            note.querySelector('.n-leave-time').textContent = item.travel[item.travel.mode].leave;
          });
        });
      }

      note.addEventListener('click', function(){ bringToFront(item.id); });
      note.addEventListener('keydown', function(e){
        if(e.target === note && (e.key === 'Enter' || e.key === ' ')){
          e.preventDefault();
          bringToFront(item.id);
        }
      });

      noteEls[item.id] = note;
      board.appendChild(note);
    });
    layout();
  }

  function layout(){
    order.forEach(function(id, slot){
      var s = SLOTS[slot], el = noteEls[id];
      el.style.setProperty('--x', s.x);
      el.style.setProperty('--y', s.y + 'px');
      el.style.setProperty('--rot', s.rot + 'deg');
      el.style.setProperty('--z', String(10 - slot));
    });
  }

  function bringToFront(id){
    var i = order.indexOf(id);
    if(i <= 0) return;
    order.splice(i, 1);
    order.unshift(id);
    layout();
  }

  renderTimeline();
  buildNotes();
</script>
</body>
</html>
